# A rendered menu, standing in for what scripts/ci/grub-render.sh produces from
# scripts/ci/grub.cfg.in. The preflight only has to see that the bootloader member
# carries a configuration at all; tests/modules/ci/test_release_preflight.sh builds the
# boot.tar around this file, and tests/modules/ab is where the rendering rules live.
set timeout=3
set default=0
set fallback=0

menuentry "N5105 AB slot a" --id n5105-a {
	set ab_slot=a
	linux /vmlinuz-a root=/dev/ram0 console=tty0 console=ttyS0,115200 ab.slot=a
	initrd /initrd-a
}

menuentry "N5105 AB slot b" --id n5105-b {
	set ab_slot=b
	linux /vmlinuz-b root=/dev/ram0 console=tty0 console=ttyS0,115200 ab.slot=b
	initrd /initrd-b
}

if [ -f /boot/grub/ab-slot.cfg ]; then
	source /boot/grub/ab-slot.cfg
fi
