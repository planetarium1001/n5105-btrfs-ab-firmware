# Single source of truth for the upstream ImmortalWrt release the pipeline pins.
#
# scripts/ci/lib.sh reads this file through `ci_upstream_pin_read` and rewrites it
# through `ci_write_upstream_pin`; nothing else in the tree may inline the version.
# The upstream auto-release workflow (task 20261112-02) bumps the pin by calling that
# write function, so two branches never have to edit the same line of lib.sh.
#
# The .conf suffix is deliberate: the workflow policy forbids any path containing
# ".env" (that is where secrets live), and this file holds a version, not a secret.
#
# Format: exactly one KEY=VALUE line. UPSTREAM_VERSION must match ^[0-9]+\.[0-9]+\.[0-9]+$
# (a formal release, never an rc or a SNAPSHOT). The value is part of the fetch cache
# key, so bumping it invalidates cached downloads by construction.
UPSTREAM_VERSION=25.12.2
