name: S4 slots

# Stage S4 - A/B state machine and health check, through the real boot path.
#
# The image boots a real system: GRUB runs from the ESP, picks the entry ab-slot.cfg names,
# the boot initramfs composes the overlay root, `ab-boot` records the boot and `ab-commit`
# runs the three probes and commits or abandons. Four boots, nothing wiped in between:
#
#   boot 1  fresh image, committed=a   -> probes pass, commit slot a
#   boot 2  slot b broken, pending=b   -> probes fail, abandon b, reboot to a
#   boot 3  slot b repaired, pending=b -> probes pass, commit slot b
#   boot 4  rollback to slot a         -> probes pass, commit slot a
#
# The guest never grades itself: each boot stops when `ab-commit` prints its decision and
# ab-phase.sh reads the ESP back for the judge line. Between phases grub-render.sh
# --verify-esp re-reads the same ESP, so a state file and a runtime slot file that disagree
# fail instead of waiting for a device.

on:
  workflow_call:
    inputs:
      upstream_version: {description: "Resolved upstream version", required: true, type: string}
      upstream_base_url: {description: "Release directory URL for the target", required: true, type: string}
      kmods_dir: {description: "Kernel module directory name on the mirror", required: true, type: string}
      kernel_package: {description: "Kernel package version from the upstream manifest", required: true, type: string}
      platform_version: {description: "Platform version from the repository VERSION file", required: true, type: string}
    outputs:
      line_commit_a: {description: "Judge line of the first boot (commit slot a)", value: "${{ jobs.s4.outputs.line_commit_a }}"}
      line_abandon_b: {description: "Judge line of the failure-injection boot (abandon slot b)", value: "${{ jobs.s4.outputs.line_abandon_b }}"}
      line_commit_b: {description: "Judge line of the switch boot (commit slot b)", value: "${{ jobs.s4.outputs.line_commit_b }}"}
      line_rollback: {description: "Judge line of the rollback boot (commit slot a again)", value: "${{ jobs.s4.outputs.line_rollback }}"}
      committed_final: {description: "Slot committed after the last boot", value: "${{ jobs.s4.outputs.committed_final }}"}
      next_slot_final: {description: "Slot GRUB would boot after the last phase", value: "${{ jobs.s4.outputs.next_slot_final }}"}
      grub_cfg_sha256: {description: "sha256 of the rendered GRUB configuration", value: "${{ jobs.s4.outputs.grub_cfg_sha256 }}"}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  s4:
    name: S4 slots - A/B state machine
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      CI_UPSTREAM_BASE_URL: ${{ inputs.upstream_base_url }}
      CI_KMODS_DIR: ${{ inputs.kmods_dir }}
      CI_KERNEL_PACKAGE: ${{ inputs.kernel_package }}
      CI_PLATFORM_VERSION: ${{ inputs.platform_version }}
    outputs:
      line_commit_a: ${{ steps.phase1.outputs.judge_line }}
      line_abandon_b: ${{ steps.phase2.outputs.judge_line }}
      line_commit_b: ${{ steps.phase3.outputs.judge_line }}
      line_rollback: ${{ steps.phase4.outputs.judge_line }}
      committed_final: ${{ steps.phase4.outputs.committed }}
      next_slot_final: ${{ steps.verify4.outputs.esp_next_slot }}
      grub_cfg_sha256: ${{ steps.disk.outputs.grub_cfg_sha256 }}
    steps:
      - name: Check out the repository
        uses: ./.github/actions/setup-ci
        with:
          download-upstream: "true"
          apt: btrfs-progs dosfstools gdisk util-linux cpio kmod qemu-system-x86 ovmf grub-common

      - name: Unpack the btrfs and vfat module closure
        id: kmods
        uses: ./.github/actions/run-stage-script
        with: {script: kmods.sh}

      - name: Prepare the ESP from the upstream bootloader
        id: esp
        uses: ./.github/actions/run-stage-script
        with: {script: esp-prepare.sh, log: esp.log}

      - name: Build the boot initramfs
        id: initramfs
        env:
          CI_KERNEL_VERSION: ${{ steps.kmods.outputs.kernel_version }}
          CI_INITRAMFS_OUT: ${{ runner.temp }}/ci/initramfs/boot.cpio.gz
          CI_INIT_SCRIPT: ${{ github.workspace }}/initramfs/boot/init
          CI_EXTRA_FILES: ${{ github.workspace }}/initramfs/lib/wf.sh:/lib/wf.sh ${{ github.workspace }}/initramfs/boot/post.sh:/s3-post.sh
        run: bash scripts/ci/initramfs.sh 2>&1 | tee -a "${CI_LOG_DIR}/initramfs.log"

      # The platform layer carries btrfs-progs: the upstream rootfs has no btrfs tool.
      - name: Resolve the btrfs runtime closure
        id: runtime
        uses: ./.github/actions/run-stage-script
        with: {script: platform-runtime.sh, log: runtime.log}

      - name: Assemble the disk image
        id: disk
        env:
          CI_PLATFORM_RUNTIME_DIR: ${{ runner.temp }}/ci/runtime
          CI_INITRAMFS: ${{ steps.initramfs.outputs.initramfs_path }}
          CI_ESP_DIR: ${{ steps.esp.outputs.esp_dir }}
        run: bash scripts/ci/disk.sh 2>&1 | tee -a "${CI_LOG_DIR}/disk.log"

      # The boot below hands the machine to the firmware, so the ESP must be bootable first.
      - name: Preflight - the ESP boots through GRUB
        id: verify0
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE}" 2>&1 | tee -a "${CI_LOG_DIR}/grub-preflight.log"

      # A test network fixture for the wan probe, plus unused space so growth can run.
      - name: Add the test network fixture and a disk tail to grow into
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/ab-fixtures.sh --network --grow-tail 2048 2>&1 | tee -a "${CI_LOG_DIR}/fixture-network.log"

      - name: Boot 1 - commit slot a
        id: boot1
        uses: ./.github/actions/qemu-boot
        with:
          case: s4-boot1
          mode: uefi-disk
          initramfs: ${{ steps.initramfs.outputs.initramfs_path }}
          image: ${{ steps.disk.outputs.image_path }}
          judge-prefix: ""
          stop-pattern: '^(ab-commit: committed slot=|ab-commit: stage=healthcheck-done .*result=fail|ab-commit: stage=commit .*result=fail|ab-boot: stage=boot result=fail)'

      # S16 ab-net-seed must skip the existing fixture, observed on a real boot through the ring log.
      - name: Phase 1 - verify the commit of slot a
        id: phase1
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          bash scripts/ci/ab-phase.sh --phase commit --slot a \
            --expect-committed a --expect-pending none \
            --expect-log 'stage=device' \
            --expect-log 'disk=/dev/vda' \
            --expect-log 'stage=net-seed result=skip' \
            --expect-log 'stage=grow slot=a result=done' \
            --expect-log 'stage=commit slot=a' \
            2>&1 | tee -a "${CI_LOG_DIR}/phase1.log"

      # The growth reason has to survive the boot on the ESP, or a UART-less failure has none.
      - name: Verify the grow log reached the ESP
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          out="${RUNNER_TEMP}/ci/disk/grow.log"
          bash scripts/ci/ab-fixtures.sh --cat ab/log/grow.log "${out}"
          cat "${out}" | tee -a "${CI_LOG_DIR}/grow.log"
          grep -q '\[grow\]' "${out}" \
            || { echo "ab/log/grow.log carries no [grow] lines" >&2; exit 1; }

      - name: Verify the runtime file and the state agree after the commit
        id: verify1
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE}" 2>&1 | tee -a "${CI_LOG_DIR}/grub-after-commit-a.log"

      - name: Fixture - break slot b and mark it pending
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/ab-fixtures.sh --break-slot b --pending b 2>&1 | tee -a "${CI_LOG_DIR}/fixture-break.log"

      # The pending marker has to reach the file GRUB sources, or boot 2 could pass wrongly.
      - name: Verify the pending marker reached the runtime slot file
        id: verify2
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE}" 2>&1 | tee -a "${CI_LOG_DIR}/grub-pending-b.log"

      - name: Boot 2 - health check fails, slot b is abandoned
        id: boot2
        uses: ./.github/actions/qemu-boot
        with:
          case: s4-boot2
          mode: uefi-disk
          initramfs: ${{ steps.initramfs.outputs.initramfs_path }}
          image: ${{ steps.disk.outputs.image_path }}
          judge-prefix: ""
          stop-pattern: '^(ab-commit: abandoned slot=|ab-commit: stage=healthcheck-done .*result=fail|ab-commit: stage=commit .*result=fail|ab-boot: stage=boot result=fail)'

      - name: Phase 2 - verify the abandon and the untouched committed slot
        id: phase2
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          bash scripts/ci/ab-phase.sh --phase abandon --slot b \
            --expect-committed a --expect-pending none \
            --expect-log 'reason=healthcheck-failed' \
            2>&1 | tee -a "${CI_LOG_DIR}/phase2.log"

      # The abandoned slot must not be retried: the file has to be back on the committed one.
      - name: Verify the abandon moved the next boot back to the committed slot
        id: verify3
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE}" 2>&1 | tee -a "${CI_LOG_DIR}/grub-after-abandon.log"

      - name: Fixture - repair slot b and mark it pending
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/ab-fixtures.sh --repair-slot b --pending b 2>&1 | tee -a "${CI_LOG_DIR}/fixture-repair.log"

      - name: Boot 3 - commit slot b
        id: boot3
        uses: ./.github/actions/qemu-boot
        with:
          case: s4-boot3
          mode: uefi-disk
          initramfs: ${{ steps.initramfs.outputs.initramfs_path }}
          image: ${{ steps.disk.outputs.image_path }}
          judge-prefix: ""
          stop-pattern: '^(ab-commit: committed slot=|ab-commit: stage=healthcheck-done .*result=fail|ab-commit: stage=commit .*result=fail|ab-boot: stage=boot result=fail)'

      - name: Phase 3 - verify the commit of slot b
        id: phase3
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          bash scripts/ci/ab-phase.sh --phase commit --slot b \
            --expect-committed b --expect-pending none \
            --expect-log 'stage=device' \
            --expect-log 'disk=/dev/vda' \
            --expect-log 'stage=commit slot=b' \
            2>&1 | tee -a "${CI_LOG_DIR}/phase3.log"

      # The shipped ab-slot, not a host copy: the machine has to follow the hint it writes.
      - name: Fixture - roll back through the shipped ab-slot
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/ci/rollback"
          rm -rf "${work}"
          mkdir -p "${work}/esp" "${work}/slot-a"
          loop="$(sudo losetup --find --show --partscan "${CI_IMAGE}")"
          cleanup() {
            sudo umount "${work}/esp" 2>/dev/null || true
            sudo umount "${work}/slot-a" 2>/dev/null || true
            sudo losetup -d "${loop}" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo mount "${loop}p2" "${work}/slot-a"
          sudo cp "${work}/slot-a/@platform/usr/sbin/ab-slot" "${work}/ab-slot"
          sudo cp "${work}/slot-a/@platform/lib/ab-slot-cfg.sh" "${work}/ab-slot-cfg.sh"
          sudo umount "${work}/slot-a"
          sudo mount "${loop}p1" "${work}/esp"
          sudo env AB_ESP="${work}/esp" AB_CMD=/dev/null AB_SLOT_CFG_LIB="${work}/ab-slot-cfg.sh" \
            sh "${work}/ab-slot" rollback 2>&1 | sed 's/^/[rollback]   /' \
            | tee -a "${CI_LOG_DIR}/fixture-rollback.log"
          sudo sync
          sudo umount "${work}/esp"

      - name: Verify the rollback moved the next boot to the other slot
        id: verify4a
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE}" 2>&1 | tee -a "${CI_LOG_DIR}/grub-after-rollback.log"

      - name: Boot 4 - the rollback boots and commits
        id: boot4
        uses: ./.github/actions/qemu-boot
        with:
          case: s4-boot4
          mode: uefi-disk
          initramfs: ${{ steps.initramfs.outputs.initramfs_path }}
          image: ${{ steps.disk.outputs.image_path }}
          judge-prefix: ""
          stop-pattern: '^(ab-commit: committed slot=|ab-commit: stage=healthcheck-done .*result=fail|ab-commit: stage=commit .*result=fail|ab-boot: stage=boot result=fail)'

      - name: Phase 4 - verify the rollback boot committed slot a
        id: phase4
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          bash scripts/ci/ab-phase.sh --phase rollback --slot a \
            --expect-committed a --expect-pending none \
            --expect-log 'stage=commit slot=a' \
            2>&1 | tee -a "${CI_LOG_DIR}/phase4.log"

      - name: Verify the final runtime file matches the final state
        id: verify4
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE}" 2>&1 | tee -a "${CI_LOG_DIR}/grub-final.log"

      - name: Collect the stage evidence
        if: always()
        uses: ./.github/actions/stage-evidence
        with:
          stage: s4
          name: evidence-s4
          diag-args: ${{ runner.temp }}/ci/qemu
          paths: |
            ${{ runner.temp }}/ci/logs
            ${{ runner.temp }}/ci/ab-phase/evidence
            ${{ runner.temp }}/ci/disk/grub.cfg
            ${{ runner.temp }}/ci/disk/ab-slot.cfg
            ${{ runner.temp }}/ci/disk/platform.tar

      # The five-column block, rendered by bash scripts/ci/stage-summary.sh --stage s4.
      - name: Write stage summary
        if: always()
        uses: ./.github/actions/stage-summary
        with:
          stage: s4
          result: ${{ job.status }}
          artifact: evidence-s4
          artifact-file: ${{ runner.temp }}/ci/disk/platform.tar
