name: ci-s4

# Stage S4 - A/B state machine and health check.
#
# The image from S2/S3 now boots a real system: the boot initramfs composes the
# overlay root, `ab-boot` records the boot and marks a candidate, and `ab-commit`
# runs the three probes from docs/lifecycle.md and either commits or abandons.
#
# Three boots against the same image file, nothing wiped in between:
#
#   boot 1  normal boot of slot a      -> probes pass, commit slot a
#   boot 2  slot b broken, pending=b   -> probes fail, abandon b, reboot to a
#   boot 3  slot b repaired, pending=b -> probes pass, commit slot b
#
# The guest is never asked to grade itself: each boot stops when `ab-commit` prints
# its decision, and scripts/ci/ab-phase.sh then reads the ESP back and prints the
# frozen judge line for that phase.
#
# The failure injected in boot 2 is a broken `nft` in slot b. Breaking `/sbin/init`
# instead would stop the system before rcS, so `ab-commit` would never run and the
# documented abandon path would never be exercised.

on:
  workflow_call:
    inputs:
      upstream_version:
        description: "Resolved upstream version"
        required: true
        type: string
      upstream_base_url:
        description: "Release directory URL for the target"
        required: true
        type: string
      kmods_dir:
        description: "Kernel module directory name on the mirror"
        required: true
        type: string
      kernel_package:
        description: "Kernel package version from the upstream manifest"
        required: true
        type: string
      platform_version:
        description: "Platform version recorded in the @platform layer"
        required: false
        type: string
        default: "0.0.2"
    outputs:
      line_commit_a:
        description: "Judge line of the first boot (commit slot a)"
        value: ${{ jobs.s4.outputs.line_commit_a }}
      line_abandon_b:
        description: "Judge line of the failure-injection boot (abandon slot b)"
        value: ${{ jobs.s4.outputs.line_abandon_b }}
      line_commit_b:
        description: "Judge line of the switch boot (commit slot b)"
        value: ${{ jobs.s4.outputs.line_commit_b }}
      committed_final:
        description: "Slot committed after the last boot"
        value: ${{ jobs.s4.outputs.committed_final }}
      grub_cfg_sha256:
        description: "sha256 of the rendered GRUB configuration"
        value: ${{ jobs.s4.outputs.grub_cfg_sha256 }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  s4:
    name: slot state machine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      CI_UPSTREAM_BASE_URL: ${{ inputs.upstream_base_url }}
      CI_KMODS_DIR: ${{ inputs.kmods_dir }}
      CI_KERNEL_PACKAGE: ${{ inputs.kernel_package }}
      CI_PLATFORM_VERSION: ${{ inputs.platform_version }}
    outputs:
      line_commit_a: ${{ steps.phase1.outputs.judge_line }}
      line_abandon_b: ${{ steps.phase2.outputs.judge_line }}
      line_commit_b: ${{ steps.phase3.outputs.judge_line }}
      committed_final: ${{ steps.phase3.outputs.committed }}
      grub_cfg_sha256: ${{ steps.disk.outputs.grub_cfg_sha256 }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download upstream artifacts
        uses: actions/download-artifact@v4
        with:
          name: upstream-files
          path: ${{ runner.temp }}/ci/fetch

      - name: Install image and QEMU tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            btrfs-progs dosfstools gdisk util-linux cpio kmod qemu-system-x86 ovmf
          if [ ! -x /bin/busybox ]; then
            sudo apt-get install -y --no-install-recommends busybox-static \
              || sudo apt-get install -y --no-install-recommends busybox-initramfs
          fi
          mkfs.btrfs --version
          qemu-system-x86_64 --version | head -n 1

      - name: Unpack the btrfs and vfat module closure
        id: kmods
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/kmods.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/kmods.log"

      - name: Prepare the ESP from the upstream bootloader
        id: esp
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/esp-prepare.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/esp.log"

      - name: Build the boot initramfs
        id: initramfs
        env:
          CI_KERNEL_VERSION: ${{ steps.kmods.outputs.kernel_version }}
          CI_INITRAMFS_OUT: ${{ runner.temp }}/ci/initramfs/boot.cpio.gz
          CI_INIT_SCRIPT: ${{ github.workspace }}/initramfs/boot/init
          CI_EXTRA_FILES: ${{ github.workspace }}/initramfs/lib/wf.sh:/lib/wf.sh ${{ github.workspace }}/initramfs/boot/post.sh:/s3-post.sh
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/initramfs.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/initramfs.log"

      - name: Assemble the disk image
        id: disk
        env:
          CI_INITRAMFS: ${{ steps.initramfs.outputs.initramfs_path }}
          CI_ESP_DIR: ${{ steps.esp.outputs.esp_dir }}
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/disk.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/disk.log"

      # The wan probe needs a device to look at; the production network config is
      # S5's job, so the harness writes a documented test fixture into the writable
      # layer.
      - name: Add the test network fixture
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/ab-fixtures.sh --network 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/fixture-network.log"

      - name: "Boot 1: commit slot a (gating)"
        id: boot1
        env:
          CI_KERNEL: ${{ runner.temp }}/ci/fetch/upstream/kernel.bin
          CI_INITRAMFS: ${{ steps.initramfs.outputs.initramfs_path }}
          CI_QEMU_DISK: ${{ steps.disk.outputs.image_path }}
          CI_JUDGE_PREFIX: ""
          CI_QEMU_STOP_PATTERN: "^ab-commit: committed slot="
          CI_QEMU_CASE: s4-boot1
          CI_QEMU_APPEND_EXTRA: ab.slot=a
          CI_QEMU_TIMEOUT: "900"
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/qemu-smoke.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/qemu-boot1.log"

      - name: "Phase 1: verify the commit of slot a"
        id: phase1
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/ab-phase.sh --phase commit --slot a \
            --expect-committed a --expect-pending none \
            --expect-log 'stage=commit slot=a' \
            2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/phase1.log"

      - name: "Fixture: break slot b and mark it pending"
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/ab-fixtures.sh --break-slot b --pending b 2>&1 \
            | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/fixture-break.log"

      - name: "Boot 2: health check fails, slot b is abandoned (gating)"
        id: boot2
        env:
          CI_KERNEL: ${{ runner.temp }}/ci/fetch/upstream/kernel.bin
          CI_INITRAMFS: ${{ steps.initramfs.outputs.initramfs_path }}
          CI_QEMU_DISK: ${{ steps.disk.outputs.image_path }}
          CI_JUDGE_PREFIX: ""
          CI_QEMU_STOP_PATTERN: "ab-commit: health check failed on the pending slot"
          CI_QEMU_CASE: s4-boot2
          CI_QEMU_APPEND_EXTRA: ab.slot=b
          CI_QEMU_TIMEOUT: "900"
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/qemu-smoke.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/qemu-boot2.log"

      - name: "Phase 2: verify the abandon and the untouched committed slot"
        id: phase2
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/ab-phase.sh --phase abandon --slot b \
            --expect-committed a --expect-pending none \
            --expect-log 'reason=healthcheck-failed' \
            2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/phase2.log"

      - name: "Fixture: repair slot b and mark it pending"
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/ab-fixtures.sh --repair-slot b --pending b 2>&1 \
            | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/fixture-repair.log"

      - name: "Boot 3: commit slot b (gating)"
        id: boot3
        env:
          CI_KERNEL: ${{ runner.temp }}/ci/fetch/upstream/kernel.bin
          CI_INITRAMFS: ${{ steps.initramfs.outputs.initramfs_path }}
          CI_QEMU_DISK: ${{ steps.disk.outputs.image_path }}
          CI_JUDGE_PREFIX: ""
          CI_QEMU_STOP_PATTERN: "^ab-commit: committed slot="
          CI_QEMU_CASE: s4-boot3
          CI_QEMU_APPEND_EXTRA: ab.slot=b
          CI_QEMU_TIMEOUT: "900"
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/qemu-smoke.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/qemu-boot3.log"

      - name: "Phase 3: verify the commit of slot b"
        id: phase3
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/ab-phase.sh --phase commit --slot b \
            --expect-committed b --expect-pending none \
            --expect-log 'stage=commit slot=b' \
            2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/phase3.log"

      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        env:
          CI_DIAG_DIR: ${{ runner.temp }}/ci/diagnostics
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}" "${CI_DIAG_DIR}"
          bash scripts/ci/diagnostics.sh s4 "${CI_TMP_ROOT:-${RUNNER_TEMP}/ci}/qemu" 2>&1 \
            | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/diagnostics.log"

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4-probe
          path: |
            ${{ runner.temp }}/ci/qemu/serial-*.log
            ${{ runner.temp }}/ci/ab-phase/evidence
            ${{ runner.temp }}/ci/disk/grub.cfg
            ${{ runner.temp }}/ci/disk/platform.tar
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-s4
          path: ${{ runner.temp }}/ci/diagnostics
          if-no-files-found: ignore
          retention-days: 7
