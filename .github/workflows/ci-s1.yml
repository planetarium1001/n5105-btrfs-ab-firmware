name: S1 probe

# Stage S1 - upstream-consumption spike.
#
# Question it answers: can the official upstream kernel load the official kmod-fs-btrfs set
# inside our own initramfs and mount btrfs? If yes, the upstream-consumption route (no kernel
# build) is viable. The gating boot prints
#
#     S1-RESULT=ok kernel=<vermagic> modules=<n> btrfs=mounted
#
# QEMU runs under TCG because hosted runners do not guarantee /dev/kvm. The OVMF boot is
# evidence only.

defaults: {run: {shell: bash}}  # -eo pipefail, so a gate piped into tee can fail its step
on:
  workflow_call:
    inputs:
      upstream_version: {description: "Resolved upstream version", required: true, type: string}
      upstream_base_url: {description: "Release directory URL for the target", required: true, type: string}
      kmods_dir: {description: "Kernel module directory name on the mirror", required: true, type: string}
      kernel_package: {description: "Kernel package version from the upstream manifest", required: true, type: string}
    outputs:
      judge_line: {description: "Frozen S1 judge line from the gating kernel-mode boot", value: "${{ jobs.s1.outputs.judge_line }}"}
      module_count: {description: "Number of modules unpacked from the closure", value: "${{ jobs.s1.outputs.module_count }}"}
      boot_seconds: {description: "Wall-clock seconds of the gating boot", value: "${{ jobs.s1.outputs.boot_seconds }}"}
      uefi_line: {description: "Judge line from the informational OVMF boot", value: "${{ jobs.s1.outputs.uefi_line }}"}
      apk_crosscheck: {description: "Result of the apk-based cross-check: ok, differ or error", value: "${{ jobs.s1.outputs.apk_crosscheck }}"}

permissions:
  contents: read

jobs:
  s1:
    name: S1 probe - kernel mounts btrfs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      CI_UPSTREAM_BASE_URL: ${{ inputs.upstream_base_url }}
      CI_KMODS_DIR: ${{ inputs.kmods_dir }}
      CI_KERNEL_PACKAGE: ${{ inputs.kernel_package }}
    outputs:
      judge_line: ${{ steps.probe.outputs.judge_line }}
      module_count: ${{ steps.kmods.outputs.module_count }}
      boot_seconds: ${{ steps.probe.outputs.boot_seconds }}
      uefi_line: ${{ steps.probe_uefi.outputs.judge_line }}
      apk_crosscheck: ${{ steps.apk_crosscheck.outputs.verdict }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci
        with:
          download-upstream: "true"
          apt: qemu-system-x86 ovmf btrfs-progs cpio kmod

      # No busybox here: the initramfs takes busybox from the locked upstream packages.
      - name: Unpack and verify the btrfs module closure
        id: kmods
        uses: ./.github/actions/run-stage-script
        with: {script: kmods.sh}

      - name: Build the probe initramfs
        id: initramfs
        env:
          CI_KERNEL_VERSION: ${{ steps.kmods.outputs.kernel_version }}
        run: bash scripts/ci/initramfs.sh 2>&1 | tee -a "${CI_LOG_DIR}/initramfs.log"

      - name: Boot the kernel and mount btrfs
        id: probe
        uses: ./.github/actions/qemu-boot
        with:
          case: s1-kernel
          initramfs: ${{ runner.temp }}/ci/initramfs/initramfs.cpio.gz
          log: qemu.log

      - name: Boot through OVMF - advisory
        id: probe_uefi
        if: always()
        continue-on-error: true
        uses: ./.github/actions/qemu-boot
        with:
          case: s1-uefi
          mode: uefi
          initramfs: ${{ runner.temp }}/ci/initramfs/initramfs.cpio.gz

      - name: Cross-check the closure with the upstream apk - advisory
        id: apk_crosscheck
        if: always()
        continue-on-error: true
        env:
          CI_REFERENCE_ROOT: ${{ runner.temp }}/ci/rootfs
        run: bash scripts/ci/apk-crosscheck.sh 2>&1 | tee -a "${CI_LOG_DIR}/apk-crosscheck.log"

      - name: Collect the stage evidence
        if: always()
        uses: ./.github/actions/stage-evidence
        with:
          stage: s1
          name: evidence-s1
          paths: |
            ${{ runner.temp }}/ci/logs
            ${{ runner.temp }}/ci/qemu/mkfs.log
            ${{ runner.temp }}/ci/kmods/inventory.json
            ${{ runner.temp }}/ci/initramfs/initramfs.cpio.gz

      # The five-column block, rendered by bash scripts/ci/stage-summary.sh --stage s1.
      - name: Write stage summary
        if: always()
        uses: ./.github/actions/stage-summary
        with:
          stage: s1
          result: ${{ job.status }}
          artifact: evidence-s1
          artifact-file: ${{ runner.temp }}/ci/initramfs/initramfs.cpio.gz
