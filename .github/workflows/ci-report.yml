name: ci-report

# Stage 5 - report.
#
# Renders the pipeline verdict as a job summary and fails the run when a stage that
# was actually scheduled did not succeed. All inputs are optional strings so a
# partially scheduled pipeline (stage=fetch, stage=verify, ...) still reports.

on:
  workflow_call:
    inputs:
      stage:
        description: "Requested stage"
        required: false
        type: string
        default: "all"
      trigger:
        description: "Workflow trigger, for example push or workflow_dispatch"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref under test"
        required: false
        type: string
        default: ""
      sha:
        description: "Commit under test"
        required: false
        type: string
        default: ""
      resolve_result:
        description: "Job result of the resolve stage"
        required: false
        type: string
        default: ""
      fetch_result:
        description: "Job result of the fetch stage"
        required: false
        type: string
        default: ""
      assemble_result:
        description: "Job result of the assemble stage"
        required: false
        type: string
        default: ""
      verify_result:
        description: "Job result of the verify stage"
        required: false
        type: string
        default: ""
      s1_result:
        description: "Job result of the S1 module-load probe"
        required: false
        type: string
        default: ""
      s1_line:
        description: "Frozen S1 judge line printed by the gated boot"
        required: false
        type: string
        default: ""
      s1_modules:
        description: "Number of modules loaded by the probe"
        required: false
        type: string
        default: ""
      s1_boot_seconds:
        description: "Wall-clock seconds of the gated boot"
        required: false
        type: string
        default: ""
      s1_uefi_line:
        description: "Judge line from the informational OVMF boot"
        required: false
        type: string
        default: ""
      s1_apk_crosscheck:
        description: "Result of the apk-based closure cross-check"
        required: false
        type: string
        default: ""
      s2_result:
        description: "Job result of the S2 image assembly"
        required: false
        type: string
        default: ""
      s2_line:
        description: "Frozen S2 judge line from the gating guest run"
        required: false
        type: string
        default: ""
      s2_image_bytes:
        description: "Size of the raw disk image"
        required: false
        type: string
        default: ""
      s2_image_gz_bytes:
        description: "Size of the compressed disk image artifact"
        required: false
        type: string
        default: ""
      s2_rootfs_files:
        description: "Files in @sys as counted by the host verifier"
        required: false
        type: string
        default: ""
      s2_host_checks:
        description: "Number of host-side assertions that passed"
        required: false
        type: string
        default: ""
      upstream_version:
        description: "Resolved upstream version"
        required: false
        type: string
        default: ""
      version_source:
        description: "Where the upstream version came from"
        required: false
        type: string
        default: ""
      kernel_package:
        description: "Resolved kernel package version"
        required: false
        type: string
        default: ""
      kmods_dir:
        description: "Kernel module directory name"
        required: false
        type: string
        default: ""
      cache_key:
        description: "Cache key used by the fetch stage"
        required: false
        type: string
        default: ""
      cache_hit:
        description: "Whether the fetch stage reused cached downloads"
        required: false
        type: string
        default: ""
      fetch_total_bytes:
        description: "Total size of the fetched upstream members"
        required: false
        type: string
        default: ""
      payload_members:
        description: "Comma separated list of payload members"
        required: false
        type: string
        default: ""
      payload_total_bytes:
        description: "Total size of the payload members"
        required: false
        type: string
        default: ""
      payload_manifest_sha256:
        description: "sha256 of the payload manifest"
        required: false
        type: string
        default: ""
      design_checks_status:
        description: "Result of scripts/check_design.py all"
        required: false
        type: string
        default: ""
      design_checks_problems:
        description: "Number of reported design problems"
        required: false
        type: string
        default: ""
      shellcheck_status:
        description: "Result of ShellCheck in the verify stage"
        required: false
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  report:
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CI_REQUESTED_STAGE: ${{ inputs.stage }}
      CI_TRIGGER: ${{ inputs.trigger }}
      CI_REF: ${{ inputs.ref }}
      CI_SHA: ${{ inputs.sha }}
      CI_RESOLVE_RESULT: ${{ inputs.resolve_result }}
      CI_FETCH_RESULT: ${{ inputs.fetch_result }}
      CI_ASSEMBLE_RESULT: ${{ inputs.assemble_result }}
      CI_VERIFY_RESULT: ${{ inputs.verify_result }}
      CI_S1_RESULT: ${{ inputs.s1_result }}
      CI_S1_LINE: ${{ inputs.s1_line }}
      CI_S1_MODULES: ${{ inputs.s1_modules }}
      CI_S1_BOOT_SECONDS: ${{ inputs.s1_boot_seconds }}
      CI_S1_UEFI_LINE: ${{ inputs.s1_uefi_line }}
      CI_S1_APK_CROSSCHECK: ${{ inputs.s1_apk_crosscheck }}
      CI_S2_RESULT: ${{ inputs.s2_result }}
      CI_S2_LINE: ${{ inputs.s2_line }}
      CI_S2_IMAGE_BYTES: ${{ inputs.s2_image_bytes }}
      CI_S2_IMAGE_GZ_BYTES: ${{ inputs.s2_image_gz_bytes }}
      CI_S2_ROOTFS_FILES: ${{ inputs.s2_rootfs_files }}
      CI_S2_HOST_CHECKS: ${{ inputs.s2_host_checks }}
      CI_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      CI_VERSION_SOURCE: ${{ inputs.version_source }}
      CI_KERNEL_PACKAGE: ${{ inputs.kernel_package }}
      CI_KMODS_DIR: ${{ inputs.kmods_dir }}
      CI_CACHE_KEY: ${{ inputs.cache_key }}
      CI_CACHE_HIT: ${{ inputs.cache_hit }}
      CI_FETCH_TOTAL_BYTES: ${{ inputs.fetch_total_bytes }}
      CI_PAYLOAD_MEMBERS: ${{ inputs.payload_members }}
      CI_PAYLOAD_TOTAL_BYTES: ${{ inputs.payload_total_bytes }}
      CI_PAYLOAD_MANIFEST_SHA256: ${{ inputs.payload_manifest_sha256 }}
      CI_DESIGN_CHECKS_STATUS: ${{ inputs.design_checks_status }}
      CI_DESIGN_PROBLEMS: ${{ inputs.design_checks_problems }}
      CI_SHELLCHECK_STATUS: ${{ inputs.shellcheck_status }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Write the pipeline summary
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/report.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/report.log"

      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        env:
          CI_DIAG_DIR: ${{ runner.temp }}/ci/diagnostics
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/diagnostics.sh report 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/diagnostics.log"

      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-report
          path: ${{ runner.temp }}/ci
          if-no-files-found: ignore
          retention-days: 7
