name: cross-version upgrade

# The seam between two releases: an image built from the previous formal release, upgraded
# with this release's payload, in one QEMU run.
#
# Every other stage proves something about a single release. This one is the only evidence
# that an upgrade across versions actually commits - which is what the update prompt means
# when it tells a user that a patch range is covered (docs/update.md).
#
# It is composed from stages that already exist: ci-s3.yml builds the old image, the payload
# is the one this run's own assemble job already built, and scripts/ci/cross-upgrade.sh boots
# the one and installs the other, then grades the facts. It runs on the tag line only, with a
# hard 35 minute ceiling. The payload is not rebuilt here: it would be the same release built
# twice, and a second artifact of the same name makes download-artifact ambiguous.

defaults: {run: {shell: bash}}  # -eo pipefail, so a gate piped into tee can fail its step
on:
  workflow_call:
    inputs:
      gaps: {description: "Set by the selector; a non-zero value skips the stage", required: false, type: string, default: ""}
    outputs:
      verdict: {description: "cross-upgrade=ok|fail|skipped line", value: "${{ jobs.cross.outputs.verdict }}"}

permissions:
  contents: read

jobs:
  # What this release is built from: VERSION and the pin are the tagged line's own facts,
  # so the caller does not have to pass them (and cannot pass them wrong).
  resolve-new:
    name: resolve this release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.read.outputs.version }}
      platform_version: ${{ steps.read.outputs.platform_version }}
      upstream_base_url: ${{ steps.resolve.outputs.upstream_base_url }}
      kmods_dir: ${{ steps.resolve.outputs.kmods_dir }}
      kernel_package: ${{ steps.resolve.outputs.kernel_package }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read the release identity
        id: read
        run: |
          set -euo pipefail
          version="$(sed -n 's/^UPSTREAM_VERSION=//p' .github/upstream-pin.conf | head -n 1)"
          [ -n "${version}" ] || { echo "the pin file has no UPSTREAM_VERSION" >&2; exit 1; }
          platform_version="$(tr -d ' \n' <VERSION)"
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"
          printf 'platform_version=%s\n' "${platform_version}" >>"${GITHUB_OUTPUT}"
          echo "this release: upstream ${version}, platform ${platform_version}"
      - name: Resolve the upstream layout
        id: resolve
        env:
          CI_UPSTREAM_VERSION: ${{ steps.read.outputs.version }}
        run: bash scripts/ci/resolve.sh 2>&1 | tee -a "${RUNNER_TEMP}/resolve-new.log"

  # Which release to upgrade from, and which mirror layout it has: both belong to the
  # pipeline, not to the caller, so the caller only says what it is publishing.
  select-previous:
    name: select the previous release
    needs: [resolve-new]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pick.outputs.version }}
      gaps: ${{ steps.pick.outputs.gaps }}
      has_previous: ${{ steps.pick.outputs.has_previous }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Select the previous formal release
        id: pick
        env:
          CI_UPSTREAM_VERSION: ${{ needs.resolve-new.outputs.version }}
        run: |
          set -euo pipefail
          # matrix-select emits through ci_emit_output: $GITHUB_OUTPUT in Actions, and
          # CI_OUTPUT_ENV only when that is set. Without this line the file read below was
          # never written, `previous` became none, and every downstream job was skipped -
          # the stage looked green while never running (run 43561858131).
          export CI_OUTPUT_ENV="${RUNNER_TEMP}/matrix.env"
          bash scripts/ci/matrix-select.sh --version "${CI_UPSTREAM_VERSION}" --count 1 2>&1 | tee -a "${RUNNER_TEMP}/matrix.log"
          env_file="${CI_OUTPUT_ENV}"
          candidates="$(sed -n 's/^candidates=//p' "${env_file}" 2>/dev/null || true)"
          gaps="$(sed -n 's/^gaps=//p' "${env_file}" 2>/dev/null || true)"
          previous="$(printf '%s\n' "${candidates}" | awk '{print $2}')"
          printf 'version=%s\n' "${previous}" >>"${GITHUB_OUTPUT}"
          printf 'gaps=%s\n' "${gaps:-0}" >>"${GITHUB_OUTPUT}"
          if [ -n "${previous}" ]; then printf 'has_previous=true\n' >>"${GITHUB_OUTPUT}"
          else printf 'has_previous=false\n' >>"${GITHUB_OUTPUT}"; fi
          printf 'previous=%s gaps=%s\n' "${previous:-none}" "${gaps:-0}"

  resolve-old:
    name: resolve the previous release
    needs: [select-previous]
    if: ${{ needs.select-previous.outputs.has_previous == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      upstream_base_url: ${{ steps.resolve.outputs.upstream_base_url }}
      kmods_dir: ${{ steps.resolve.outputs.kmods_dir }}
      kernel_package: ${{ steps.resolve.outputs.kernel_package }}
      rootfs_name: ${{ steps.resolve.outputs.rootfs_name }}
      kernel_name: ${{ steps.resolve.outputs.kernel_name }}
      btrfs_kmod_name: ${{ steps.resolve.outputs.btrfs_kmod_name }}
      rootfs_sha256: ${{ steps.resolve.outputs.rootfs_sha256 }}
      kernel_sha256: ${{ steps.resolve.outputs.kernel_sha256 }}
      btrfs_kmod_sha256: ${{ steps.resolve.outputs.btrfs_kmod_sha256 }}
      cache_key: ${{ steps.resolve.outputs.cache_key }}
      cache_restore_prefix: ${{ steps.resolve.outputs.cache_restore_prefix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Resolve the old release
        id: resolve
        env:
          CI_UPSTREAM_VERSION: ${{ needs.select-previous.outputs.version }}
        run: bash scripts/ci/resolve.sh 2>&1 | tee -a "${RUNNER_TEMP}/resolve.log"

  # The old image is built from the old release's own upstream files. The S3 stage used to
  # download this run's upstream-files, which the fetch stage had filled with the new release
  # (kernel 6.12.103 against modules packaged for 6.12.94), and the boot failed with
  # no-module-directory (run 43564031421). Every artifact this stage touches takes the suffix
  # below, because the tag line runs this release's own copy of each stage in the same run.
  fetch-old:
    name: fetch the old upstream files
    needs: [resolve-new, select-previous, resolve-old]
    if: ${{ needs.select-previous.outputs.has_previous == 'true' }}
    uses: ./.github/workflows/ci-fetch.yml
    with:
      upstream_version: ${{ needs.select-previous.outputs.version }}
      upstream_base_url: ${{ needs.resolve-old.outputs.upstream_base_url }}
      kmods_dir: ${{ needs.resolve-old.outputs.kmods_dir }}
      kernel_package: ${{ needs.resolve-old.outputs.kernel_package }}
      rootfs_name: ${{ needs.resolve-old.outputs.rootfs_name }}
      kernel_name: ${{ needs.resolve-old.outputs.kernel_name }}
      btrfs_kmod_name: ${{ needs.resolve-old.outputs.btrfs_kmod_name }}
      rootfs_sha256: ${{ needs.resolve-old.outputs.rootfs_sha256 }}
      kernel_sha256: ${{ needs.resolve-old.outputs.kernel_sha256 }}
      btrfs_kmod_sha256: ${{ needs.resolve-old.outputs.btrfs_kmod_sha256 }}
      cache_key: ${{ needs.resolve-old.outputs.cache_key }}
      cache_restore_prefix: ${{ needs.resolve-old.outputs.cache_restore_prefix }}
      artifact_suffix: "-old"

  old-image:
    name: build the previous image
    needs: [resolve-new, select-previous, resolve-old, fetch-old]
    if: ${{ needs.select-previous.outputs.has_previous == 'true' }}
    uses: ./.github/workflows/ci-s3.yml
    with:
      upstream_version: ${{ needs.select-previous.outputs.version }}
      upstream_base_url: ${{ needs.resolve-old.outputs.upstream_base_url }}
      kmods_dir: ${{ needs.resolve-old.outputs.kmods_dir }}
      kernel_package: ${{ needs.resolve-old.outputs.kernel_package }}
      # Both the files it downloads and the artifacts it publishes take the suffix, so this
      # build cannot see or overwrite this release's own S3 output (see fetch-old).
      artifact_suffix: "-old"
      # The platform layer is this project's, not the old release's: the image boots an
      # older upstream base with the same platform version the tag publishes.
      platform_version: ${{ needs.resolve-new.outputs.platform_version }}

  cross:
    name: cross-upgrade
    needs: [select-previous, old-image]
    runs-on: ubuntu-latest
    # 35 minutes is the whole stage budget: the old image is built in its own job, so this
    # ceiling is the QEMU run plus its assertions.
    timeout-minutes: 35
    outputs:
      verdict: ${{ steps.grade.outputs.verdict }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The same runner the S3 boot gets, because this job boots that image under QEMU and
      # mounts its partition: on a bare runner cross-upgrade.sh reports
      # skipped reason=qemu-not-available (run 43568028301), which is not a passing proof.
      # It also creates the log directory the grading step and the evidence reuse.
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci
        with:
          apt: btrfs-progs dosfstools gdisk util-linux cpio kmod qemu-system-x86 ovmf grub-common

      - name: Guard - there is no previous release to upgrade from
        id: gap
        if: ${{ needs.select-previous.outputs.has_previous != 'true' }}
        run: |
          set -euo pipefail
          printf 'cross-upgrade=skipped reason=no-previous-formal-release gaps=%s\n' "${{ needs.select-previous.outputs.gaps }}" \
            | tee -a "${GITHUB_STEP_SUMMARY}"
          printf 'verdict=cross-upgrade=skipped\n' >>"${GITHUB_OUTPUT}"

      # old-image published it with the suffix it was given, so this download cannot reach the
      # image this release's own S3 stage published in the same run.
      - name: Download the previous release's image
        if: ${{ needs.select-previous.outputs.has_previous == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-install-old
          path: ${{ runner.temp }}/ci/cross

      # The payload this release's own assemble job published in this run, not a second copy
      # built here: release.yml runs this stage after the build, so the artifact is there.
      - name: Download this release's payload
        if: ${{ needs.select-previous.outputs.has_previous == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payload-upgrade
          path: ${{ runner.temp }}/ci/cross-payload

      - name: Install this release over the previous one
        id: grade
        if: ${{ needs.select-previous.outputs.has_previous == 'true' }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/ci/cross-out"
          image="$(find "${RUNNER_TEMP}/ci/cross" -name '*.img.gz' -print -quit)"
          payload="$(find "${RUNNER_TEMP}/ci/cross-payload" -name '*.tar' -print -quit)"
          verdict="$(bash scripts/ci/cross-upgrade.sh run \
            --image "${image}" --payload "${payload}" --out "${out}" | tee -a "${CI_LOG_DIR:-/tmp}/cross.log")"
          printf '%s\n' "${verdict}" | tee -a "${GITHUB_STEP_SUMMARY}"
          printf 'verdict=%s\n' "${verdict}" >>"${GITHUB_OUTPUT}"
          case "${verdict}" in
            cross-upgrade=ok*) : ;;
            *) echo "cross-version upgrade did not pass: ${verdict}" >&2; exit 1 ;;
          esac

      # The facts the verdict was graded from, kept whether the run passed or failed: a
      # cross-version failure is investigated from these five files, not from the log. One
      # upload, after the grading wrote them - a second artifact of the same name in one run
      # is a conflict, and the facts do not exist before the step above runs.
      - name: Collect the stage evidence
        if: always()
        uses: ./.github/actions/stage-evidence
        with:
          stage: cross
          name: evidence-cross
          diag-args: ${{ runner.temp }}/ci/cross-out
          paths: |
            ${{ runner.temp }}/ci/cross-out
            ${{ runner.temp }}/ci/cross
            ${{ runner.temp }}/ci/cross-payload
            ${{ runner.temp }}/ci/logs
