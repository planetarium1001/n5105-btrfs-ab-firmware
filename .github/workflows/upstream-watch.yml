name: upstream watch

# The daily upstream watch: one run that discovers a new upstream formal release, builds it
# through the ordinary pipeline, moves the pin, merges and publishes - and proves nothing
# happened when there is nothing new.
#
# Why everything is one run: a commit or tag pushed with GITHUB_TOKEN does NOT trigger a
# workflow (GitHub's recursion guard). "Push the bump, let CI build it, let the tag release
# it" is therefore not a design that can work; the discovery, the build, the merge, the tag
# and the publish all have to happen inside this run graph.
#
#   detect ─┬─ heartbeat (no update, due)                          -> done, success
#           └─ bump -> build -> locks -> merge -> publish         -> done, success
#                            └─ any failure -> issue              -> done, failure
#
# The build runs ci.yml through `workflow_call` with `upstream_version`, so the branch and
# this run cannot disagree about which upstream release is being built; the PR carries only
# data (the pin and the three lockfiles) and `merge` asserts exactly that before merging.
#
# A run with nothing new ends successfully and touches nothing: that is the ordinary
# outcome of most days, not a failure.

on:
  # TEMPORARY REHEARSAL TRIGGER - not part of the deliverable.
  # GitHub only dispatches or schedules a workflow that exists on the default branch, so
  # this file cannot be triggered at all while it lives on a work branch. A push trigger on
  # the work branch is the only way to run it before it is merged; the next commit removes
  # this block and restores the empty defaults below.
  push:
    branches: [wf/20261112-02-upstream-auto-release-main]
  schedule:
    # 20:00 UTC = 04:00 in Beijing: after the upstream mirrors settle for the day and
    # outside the hours anyone here dispatches a build by hand.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Treat this upstream version as the new release (rehearsal only; empty means discover it)"
        type: string
        default: "25.12.1"
      dry-run:
        description: "Rehearse: merge into a scratch branch and publish a draft release"
        type: boolean
        default: true
      base:
        description: "Branch the PR is opened against and merged into"
        type: string
        default: "auto/dryrun-main"

# The workflow-level grant has to cover every permission a job grants, and every
# permission a called workflow asks for; each job below narrows it again.
permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  # What is published has to be what was proved, so every job that writes says what it
  # writes and nothing else.
  detect:
    name: detect a new upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
      current_pin: ${{ steps.detect.outputs.current_pin }}
      candidates: ${{ steps.matrix.outputs.candidates }}
      gaps: ${{ steps.matrix.outputs.gaps }}
      heartbeat: ${{ steps.heartbeat.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci

      - name: Detect the newest upstream formal release
        id: detect
        env:
          CI_FORCE_VERSION: ${{ inputs.version || '25.12.1' }}
        run: bash scripts/ci/upstream-watch.sh detect 2>&1 | tee -a "${CI_LOG_DIR}/detect.log"

      # The candidates are the new release plus the three formal releases before it. They
      # are recorded in the PR, the run summary and the release notes; they do not add
      # pipeline runs, because the multi-version matrix is a device-side concern.
      - name: Select the matrix candidates
        id: matrix
        if: ${{ steps.detect.outputs.changed == 'true' }}
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: bash scripts/ci/matrix-select.sh --version "${VERSION}" 2>&1 | tee -a "${CI_LOG_DIR}/matrix.log"

      - name: Decide whether a heartbeat tag is due
        id: heartbeat
        env:
          CI_MATRIX_CANDIDATES: ${{ steps.matrix.outputs.candidates }}
        run: bash scripts/ci/heartbeat-tag.sh --dry-run 2>&1 | tee -a "${CI_LOG_DIR}/heartbeat.log"

  # A scheduled workflow in a public repository is disabled after 60 days without
  # repository activity, and a disabled watch is a silent auto-release outage. The tag is
  # activity; its name never matches v*, so it can never trigger the release line either.
  heartbeat:
    name: heartbeat tag
    needs: detect
    if: ${{ needs.detect.outputs.changed != 'true' && needs.detect.outputs.heartbeat == 'would-create' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci
      - name: Create the heartbeat tag
        id: heartbeat
        run: bash scripts/ci/heartbeat-tag.sh 2>&1 | tee -a "${CI_LOG_DIR}/heartbeat.log"

      - name: Push the heartbeat tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.heartbeat.outputs.tag }}
          ACTION: ${{ steps.heartbeat.outputs.action }}
        run: |
          set -euo pipefail
          [ "${ACTION}" = "created" ] || { echo "no heartbeat tag to push (${ACTION})"; exit 0; }
          [ -n "${TAG}" ] || { echo "heartbeat-tag.sh reported no tag" >&2; exit 1; }
          case "${TAG}" in
            v*) echo "refusing to push ${TAG}: a v* tag would trigger the release line" >&2; exit 1 ;;
          esac
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"

  # The automatic change is a branch and a pull request, never a push to main: every
  # automatic change keeps an auditable diff and a rollback point.
  bump:
    name: open the pin pull request
    needs: detect
    if: ${{ needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      pr: ${{ steps.pr.outputs.pr }}
      base: ${{ steps.push.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci

      - name: Bump the pin on the automatic branch
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run || true }}
          BASE_INPUT: ${{ inputs.base || 'auto/dryrun-main' }}
        run: |
          set -euo pipefail
          base="${BASE_INPUT:-main}"
          branch="auto/upstream-${VERSION}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "${DRY_RUN}" = "true" ]; then
            # A rehearsal may not merge into a branch anyone builds from.
            case "${base}" in
              main|master) echo "a dry run may not open a PR against ${base}: pass --base <scratch branch>" >&2; exit 1 ;;
            esac
          fi
          # The rehearsal target can be missing on the first run.
          if ! git ls-remote --exit-code --heads origin "${base}" >/dev/null 2>&1; then
            echo "creating the rehearsal base ${base} from ${GITHUB_SHA}"
            git push "${remote}" "${GITHUB_SHA}:refs/heads/${base}"
          fi
          git config user.name "upstream-watch[bot]"
          git config user.email "upstream-watch@users.noreply.github.com"
          git checkout -B "${branch}"
          # The single write entry for the pin: scripts/ci/lib.sh owns the format.
          bash scripts/ci/upstream-watch.sh pin "${VERSION}" 2>&1 | tee -a "${CI_LOG_DIR}/pin.log"
          git add .github/upstream-pin.conf
          git commit -m "chore(ci): pin upstream ${VERSION}"
          # A re-run replaces the branch it created last time. --force-with-lease needs to
          # know what it is replacing, and a fresh checkout does not have the remote ref,
          # so it is fetched first; a branch that does not exist yet is simply pushed.
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/${branch}"
            git push --force-with-lease="${branch}:refs/remotes/origin/${branch}" \
              "${remote}" "HEAD:refs/heads/${branch}"
          else
            git push "${remote}" "HEAD:refs/heads/${branch}"
          fi
          printf 'branch=%s\n' "${branch}" >>"${GITHUB_OUTPUT}"
          printf 'base=%s\n' "${base}" >>"${GITHUB_OUTPUT}"

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.push.outputs.branch }}
          BASE: ${{ steps.push.outputs.base }}
          VERSION: ${{ needs.detect.outputs.version }}
          # The renderer reads the CI_ names: they are the same keys a local run exports.
          CI_UPSTREAM_VERSION: ${{ needs.detect.outputs.version }}
          CI_PREVIOUS_PIN: ${{ needs.detect.outputs.current_pin }}
          CI_MATRIX_CANDIDATES: ${{ needs.detect.outputs.candidates }}
          CI_MATRIX_GAPS: ${{ needs.detect.outputs.gaps }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/ci/upstream-watch.sh pr-body --out "${RUNNER_TEMP}/pr-body.md" 2>&1 | tee -a "${CI_LOG_DIR}/pr.log"
          # Re-runs reuse the open PR instead of failing on "a pull request already exists".
          pr="$(gh pr list --head "${BRANCH}" --base "${BASE}" --state open --json number --jq '.[0].number' || true)"
          if [ -n "${pr}" ] && [ "${pr}" != "null" ]; then
            gh pr edit "${pr}" --title "chore(ci): pin upstream ${VERSION}" --body-file "${RUNNER_TEMP}/pr-body.md"
          else
            gh pr create --head "${BRANCH}" --base "${BASE}" \
              --title "chore(ci): pin upstream ${VERSION}" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
            pr="$(gh pr list --head "${BRANCH}" --base "${BASE}" --state open --json number --jq '.[0].number')"
          fi
          [ -n "${pr}" ] && [ "${pr}" != "null" ] || { echo "the pull request was not created" >&2; exit 1; }
          printf 'pr=%s\n' "${pr}" >>"${GITHUB_OUTPUT}"
          echo "pull request ${pr} on ${BRANCH} -> ${BASE}"

  # The pipeline the release is published from: the same ci.yml every push runs, in this
  # same run, with the new upstream release as its input. Nothing here is a second copy of
  # that graph, and nothing waits for a push or a tag to start it.
  build:
    name: build the new upstream release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read

  # The three lockfiles are contracts for one upstream release; a new release needs its
  # own. They are derived with the same scripts the pipeline uses, committed to the branch,
  # and then *asserted* with CI_LOCK_STRICT=1 - which is the only way to prove the merged
  # tree, not just the built one, agrees with the pin.
  locks:
    name: move the lockfiles onto the new release
    needs: [detect, bump, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.bump.outputs.branch }}
          persist-credentials: false
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci
        with: {apt: "cpio kmod"}
      # The upstream files the pipeline fetched: the same bytes the modules and the runtime
      # closure were derived from.
      - name: Download the upstream files the build used
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-files
          path: ${{ runner.temp }}/ci/fetch

      # The kmods directory name and the release URL only exist once resolve.sh has run, so
      # this step wires them through ci_load_env_file: it exports every stage output as
      # CI_<UPPERCASE>, which is the same wiring a local reproduction gets. ci-debug.yml is
      # the other file that needs it, for the same reason.
      - name: Derive the lockfiles for this upstream release
        id: derive
        env:
          CI_UPSTREAM_VERSION: ${{ needs.detect.outputs.version }}
          CI_OUTPUT_ENV: ${{ runner.temp }}/ci/locks/derive.env
          CI_ROOTFS_TAR: ${{ runner.temp }}/ci/fetch/immortalwrt-${{ needs.detect.outputs.version }}-x86-64-rootfs.tar.gz
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/lib.sh
          . scripts/ci/lib.sh
          bash scripts/ci/resolve.sh >"${CI_LOG_DIR}/resolve.log" 2>&1
          ci_load_env_file "${CI_OUTPUT_ENV}"
          [ -n "${CI_KMODS_DIR:-}" ] || { echo "resolve.sh produced no kmods_dir" >&2; exit 1; }
          [ -f "${CI_ROOTFS_TAR}" ] || {
            echo "the upstream files carry no rootfs.tar.gz at ${CI_ROOTFS_TAR}" >&2
            exit 1
          }
          bash scripts/ci/kmods.sh --write-lock 2>&1 | tee -a "${CI_LOG_DIR}/locks.log"
          bash scripts/ci/platform-runtime.sh --write-lock 2>&1 | tee -a "${CI_LOG_DIR}/locks.log"
          bash scripts/ci/initramfs-tools.sh --write-lock 2>&1 | tee -a "${CI_LOG_DIR}/locks.log"
          git status --short

      - name: Commit the lockfiles to the branch
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "upstream-watch[bot]"
          git config user.email "upstream-watch@users.noreply.github.com"
          git add scripts/ci/kmod-closure.json scripts/ci/runtime-closure.json scripts/ci/initramfs-tools.lock.json
          if git diff --cached --quiet; then
            echo "the lockfiles already describe ${VERSION}"
          else
            git commit -m "chore(ci): move the lockfiles onto upstream ${VERSION}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          fi

      # The committed lockfiles are now the contract for this release: assert them, with the
      # pin contract in force, exactly as the next build on main will.
      - name: Assert the committed lockfiles
        env:
          CI_UPSTREAM_VERSION: ${{ needs.detect.outputs.version }}
          CI_LOCK_STRICT: "1"
          CI_OUTPUT_ENV: ${{ runner.temp }}/ci/locks/strict.env
          CI_ROOTFS_TAR: ${{ runner.temp }}/ci/fetch/immortalwrt-${{ needs.detect.outputs.version }}-x86-64-rootfs.tar.gz
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/lib.sh
          . scripts/ci/lib.sh
          bash scripts/ci/resolve.sh >"${CI_LOG_DIR}/resolve-strict.log" 2>&1
          ci_load_env_file "${CI_OUTPUT_ENV}"
          # CI_LOCK_STRICT=1 is what makes these three assertions mean "the committed
          # lockfiles belong to this release" instead of "a derived copy was used".
          bash scripts/ci/kmods.sh 2>&1 | tee -a "${CI_LOG_DIR}/locks-strict.log"
          bash scripts/ci/platform-runtime.sh 2>&1 | tee -a "${CI_LOG_DIR}/locks-strict.log"
          # The assert toolset stages the boot closure from the *committed* lockfile: a
          # file whose digest the lockfile does not name fails here, in this run, before
          # anything is merged.
          mkdir -p "${RUNNER_TEMP}/ci/assert-stage"
          bash scripts/ci/initramfs-tools.sh --toolset assert --stage "${RUNNER_TEMP}/ci/assert-stage" \
            2>&1 | tee -a "${CI_LOG_DIR}/locks-strict.log"

  # Squash, not a merge commit: the branch is one automatic change, and a revert of one
  # commit is the rollback.
  merge:
    name: merge and tag
    needs: [detect, bump, build, locks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci

      # What was built is what gets merged: the branch may carry the pin and the three
      # lockfiles and nothing else. A workflow that quietly touches a fourth file has
      # published something nobody built.
      - name: Guard the diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          BASE: ${{ needs.bump.outputs.base }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE}" "${BRANCH}"
          changed="$(git diff --name-only "origin/${BASE}...origin/${BRANCH}" | LC_ALL=C sort)"
          allowed=".github/upstream-pin.conf
          scripts/ci/initramfs-tools.lock.json
          scripts/ci/kmod-closure.json
          scripts/ci/runtime-closure.json"
          unexpected="$(printf '%s\n' "${changed}" | grep -vxF -f <(printf '%s\n' "${allowed}") || true)"
          if [ -n "${unexpected}" ]; then
            echo "the automatic branch changes files a build did not prove:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          printf 'the automatic branch changes exactly:\n%s\n' "${changed}"

      - name: Squash merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.bump.outputs.pr }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          gh pr merge "${PR}" --squash --delete-branch \
            --subject "chore(ci): pin upstream ${VERSION}" \
            --body "Automatic upstream release: pin ${VERSION}, lockfiles moved, build green."
          gh pr view "${PR}" --json state,mergedAt --jq '.state + " " + (.mergedAt // "")'

      # A bare X.Y.Z tag: the release is identified by the system version, and a bare tag
      # never matches the v* line, so tagging cannot start a second release.
      - name: Tag the merged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          BASE: ${{ needs.bump.outputs.base }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          case "${VERSION}" in
            v*) echo "refusing to tag ${VERSION}: the automatic line publishes bare versions" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin "${BASE}"
          sha="$(git rev-parse "origin/${BASE}")"
          git config user.name "upstream-watch[bot]"
          git config user.email "upstream-watch@users.noreply.github.com"
          git tag -a "${VERSION}" -m "ImmortalWrt ${VERSION} through the N5105 A/B pipeline" "${sha}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${VERSION}"
          echo "tagged ${sha} as ${VERSION}"

  # Same implementation as the v* release line, same preflight: the two lines cannot drift.
  publish:
    name: publish
    needs: [detect, merge]
    permissions:
      contents: write
      # release-publish.yml's job reads the build artifacts through the API, so the caller
      # has to grant it; a called job may not request more than its caller allows.
      actions: read
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.detect.outputs.version }}
      tag-policy: bare
      title: "ImmortalWrt N5105 A/B firmware {tag}"
      extra-notes: ${{ needs.detect.outputs.candidates }}
      dry-run: ${{ inputs.dry-run || true }}

  # A red run has to leave one place to look. The title is stable per upstream version, so
  # a second failure updates the issue instead of opening another one.
  issue:
    name: report the failure
    needs: [detect, bump, build, locks, merge, publish]
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
          CHANGED: ${{ needs.detect.outputs.changed }}
          BUMP: ${{ needs.bump.result }}
          BUILD: ${{ needs.build.result }}
          LOCKS: ${{ needs.locks.result }}
          MERGE: ${{ needs.merge.result }}
          PUBLISH: ${{ needs.publish.result }}
          PR: ${{ needs.bump.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_UPSTREAM_VERSION: ${{ needs.detect.outputs.version }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_LOG_ARTIFACT: logs-${{ github.run_id }}
        run: |
          set -euo pipefail
          failed=""
          for pair in "bump:${BUMP}" "build:${BUILD}" "locks:${LOCKS}" "merge:${MERGE}" "publish:${PUBLISH}"; do
            job="${pair%%:*}"; result="${pair#*:}"
            case "${result}" in
              failure|cancelled) failed="${failed} ${job}" ;;
            esac
          done
          failed="${failed# }"
          [ -n "${failed}" ] || failed="detect"
          title="[auto-release] ${VERSION:-unknown}"
          CI_AUTO_FAILED_STAGE="${failed}" CI_AUTO_REASON="run 的 ${failed} job 失败，见 run 页面与日志" \
            bash scripts/ci/upstream-watch.sh issue-body --out "${RUNNER_TEMP}/issue.md" 2>&1 \
            | tee -a "${CI_LOG_DIR}/issue.log"
          {
            printf '\n## Jobs\n\n| job | result |\n| --- | --- |\n'
            printf '| bump | %s |\n| build | %s |\n| locks | %s |\n| merge | %s |\n| publish | %s |\n\n' \
              "${BUMP}" "${BUILD}" "${LOCKS}" "${MERGE}" "${PUBLISH}"
            printf 'The automatic release stopped before publishing. Nothing was published for %s.\n' "${VERSION:-unknown}"
          } >>"${RUNNER_TEMP}/issue.md"
          gh label create auto-release --color BFD4F2 --description "Automatic upstream release" 2>/dev/null || true
          existing="$(gh issue list --label auto-release --state open --json number,title \
            --jq "[.[] | select(.title == \"${title}\")][0].number" || true)"
          if [ -n "${existing}" ] && [ "${existing}" != "null" ]; then
            gh issue comment "${existing}" --body-file "${RUNNER_TEMP}/issue.md"
            echo "updated issue #${existing}"
          else
            gh issue create --title "${title}" --body-file "${RUNNER_TEMP}/issue.md" --label auto-release
          fi
          {
            printf '## Automatic upstream release failed\n\n'
            printf '| item | value |\n| --- | --- |\n'
            printf '| version | `%s` |\n' "${VERSION:-unknown}"
            printf '| failed jobs | `%s` |\n' "${failed}"
            printf '| run | %s |\n' "${RUN_URL}"
          } >>"${GITHUB_STEP_SUMMARY}"
          exit 1
