name: Firmware CI - upstream watch

# The daily upstream watch: one run that discovers a new upstream formal release, builds it
# through the ordinary pipeline, moves the pin, merges and publishes - and proves nothing
# happened when there is nothing new.
#
# Why everything is one run: a commit or tag pushed with GITHUB_TOKEN does NOT trigger a
# workflow (GitHub's recursion guard). "Push the bump, let CI build it, let the tag release
# it" is therefore not a design that can work; the discovery, the build, the merge, the tag
# and the publish all have to happen inside this run graph.
#
#   detect ─┬─ heartbeat (no update, due)                          -> done, success
#           └─ bump -> build -> locks -> merge -> publish         -> done, success
#                            └─ any failure -> issue              -> done, failure
#
# A failed run is recovered by dispatching this workflow with the same version and a
# `resume` stage: `merge` re-runs the graph for a failure before the merge, `publish`
# finishes a release whose merge and tag already happened. `detect` reports the state the
# recovery continues from (pin in the base branch, merge commit, tag) instead of
# rediscovering a release, and `merge` splits its idempotency into skip-merge and skip-tag.
#
# The build runs ci.yml through `workflow_call` with `upstream_version`, so the branch and
# this run cannot disagree about which upstream release is being built; the PR carries only
# data (the pin and the three lockfiles) and `merge` asserts exactly that before merging.
#
# A run with nothing new ends successfully and touches nothing: that is the ordinary
# outcome of most days, not a failure.

defaults: {run: {shell: bash}}  # -eo pipefail, so a gate piped into tee can fail its step
on:
  schedule:
    # Anchored at UTC midnight: the schedule states the intent - one run per UTC day, at
    # 00:00 - and does not shift the nominal time to compensate for GitHub's queue. The
    # `schedule` trigger is best-effort, not a guarantee: a queued run can start hours after
    # the nominal time, so nothing downstream may depend on the exact hour it starts.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Treat this upstream version as the new release (rehearsal only; empty means discover it)"
        type: string
        default: ""
      dry-run:
        description: "Rehearse: merge into a scratch branch and publish a draft release"
        type: boolean
        default: false
      base:
        description: "Branch the PR is opened against and merged into"
        type: string
        default: "main"
      resume:
        description: "Recover a failed run: empty discovers, merge re-runs from the merge, publish finishes a merged release"
        type: string
        default: ""

# The workflow-level grant is the floor, not the ceiling: each job asks for exactly what it
# writes, which is where the audit of this file starts. The comments below record the two
# platform rules that shaped the graph.
# GitHub cannot nest concurrency: calling a reusable workflow that itself declares a
# concurrency group from a workflow that declares one silently drops the call (the job
# never appears in the run). The pipeline this run builds with is ci.yml, which declares
# one, so this workflow declares none. Single-flight is not lost - `merge` re-reads the pin
# from the base branch and stops when the release has already happened, so two overlapping
# runs converge on the same answer instead of merging twice.
permissions:
  contents: read

jobs:
  # What is published has to be what was proved, so every job that writes says what it
  # writes and nothing else.
  detect:
    name: detect a new upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The release's merge commit is read back from the pull request below, so a recovery
      # can prove that an existing tag names it.
      pull-requests: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
      current_pin: ${{ steps.detect.outputs.current_pin }}
      candidates: ${{ steps.matrix.outputs.candidates }}
      gaps: ${{ steps.matrix.outputs.gaps }}
      heartbeat: ${{ steps.heartbeat.outputs.action }}
      mode: ${{ steps.detect.outputs.mode }}
      resume-stage: ${{ steps.detect.outputs.resume_stage }}
      # The reason a discovery failed, when it did. The issue body is the only thing a
      # reader sees, and "see the run log" is not a reason.
      detect-error: ${{ steps.detect.outputs.detect_error }}
      pin-in-base: ${{ steps.detect.outputs.pin_in_base }}
      merged-sha: ${{ steps.detect.outputs.merged_sha }}
      tag-exists: ${{ steps.detect.outputs.tag_exists }}
      tag-sha: ${{ steps.detect.outputs.tag_sha }}
    steps:
      # The heartbeat decides from tag history and from the commit that last touched the
      # pin, and the diff guard in `merge` needs a common ancestor: neither works on
      # actions/checkout's default depth-1, tag-less clone. A shallow checkout makes the
      # pin's commit its own root, so `days_since` is always 0 and the heartbeat is never
      # due - that is why this checkout carries the same tags and depth as `heartbeat`.
      # The depth is 0, not a number: any fixed depth is an estimate of how many commits
      # separate the pin bump from HEAD, correct only for the commit density it was measured
      # at. This repository's whole history is a few megabytes, so "all of it" costs less
      # than re-measuring the estimate and is right at every density.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci

      - name: Detect the newest upstream formal release
        id: detect
        env:
          CI_FORCE_VERSION: ${{ inputs.version }}
          CI_RESUME: ${{ inputs.resume }}
          CI_BASE: ${{ inputs.base }}
          # The tag state is read from the remote, not from the checkout: a tag this run did
          # not fetch must not read as "does not exist", and the recovery contract compares
          # the tag with the merge commit the API reports.
          CI_REMOTE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/upstream-watch.sh detect 2>&1 | tee -a "${CI_LOG_DIR}/detect.log"

      # The candidates are the new release plus the three formal releases before it. They
      # are recorded in the PR, the run summary and the release notes; they do not add
      # pipeline runs, because the multi-version matrix is a device-side concern.
      - name: Select the matrix candidates
        id: matrix
        if: ${{ steps.detect.outputs.changed == 'true' }}
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: bash scripts/ci/matrix-select.sh --version "${VERSION}" 2>&1 | tee -a "${CI_LOG_DIR}/matrix.log"

      - name: Decide whether a heartbeat tag is due
        id: heartbeat
        run: bash scripts/ci/heartbeat-tag.sh --dry-run 2>&1 | tee -a "${CI_LOG_DIR}/heartbeat.log"

  # A scheduled workflow in a public repository is disabled after 60 days without
  # repository activity, and a disabled watch is a silent auto-release outage. The tag is
  # activity; its name never matches v*, so it can never trigger the release line either.
  heartbeat:
    name: heartbeat tag
    needs: detect
    if: ${{ needs.detect.outputs.changed != 'true' && needs.detect.outputs.heartbeat == 'would-create' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The tags have to be here: the script decides from the tag history whether a
      # heartbeat is due, and actions/checkout is a shallow, tag-less clone by default.
      # Without `fetch-tags` a month that already has its heartbeat is tagged again and the
      # push fails on the remote. The depth is the full history for the same reason as in
      # `detect`: the commit that last touched the pin has to have a real date, not the
      # boundary of whatever depth was guessed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci
      - name: Create the heartbeat tag
        id: heartbeat
        run: bash scripts/ci/heartbeat-tag.sh 2>&1 | tee -a "${CI_LOG_DIR}/heartbeat.log"

      - name: Push the heartbeat tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.heartbeat.outputs.tag }}
          ACTION: ${{ steps.heartbeat.outputs.action }}
        run: |
          set -euo pipefail
          [ "${ACTION}" = "created" ] || { echo "no heartbeat tag to push (${ACTION})"; exit 0; }
          [ -n "${TAG}" ] || { echo "heartbeat-tag.sh reported no tag" >&2; exit 1; }
          case "${TAG}" in
            v*) echo "refusing to push ${TAG}: a v* tag would trigger the release line" >&2; exit 1 ;;
          esac
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"

  # The automatic change is a branch and a pull request, never a push to main: every
  # automatic change keeps an auditable diff and a rollback point.
  bump:
    name: open the pin pull request
    needs: detect
    if: ${{ needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      pr: ${{ steps.pr.outputs.pr }}
      base: ${{ steps.push.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci

      - name: Bump the pin on the automatic branch
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
          BASE_INPUT: ${{ inputs.base }}
        run: |
          set -euo pipefail
          base="${BASE_INPUT:-main}"
          branch="auto/upstream-${VERSION}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "${DRY_RUN}" = "true" ]; then
            # A rehearsal may not merge into a branch anyone builds from.
            case "${base}" in
              main|master) echo "a dry run may not open a PR against ${base}: pass --base <scratch branch>" >&2; exit 1 ;;
            esac
          fi
          # The rehearsal target can be missing on the first run.
          if ! git ls-remote --exit-code --heads origin "${base}" >/dev/null 2>&1; then
            echo "creating the rehearsal base ${base} from ${GITHUB_SHA}"
            git push "${remote}" "${GITHUB_SHA}:refs/heads/${base}"
          fi
          git config user.name "upstream-watch[bot]"
          git config user.email "upstream-watch@users.noreply.github.com"
          git checkout -B "${branch}"
          # The single write entry for the pin: scripts/ci/lib.sh owns the format.
          bash scripts/ci/upstream-watch.sh pin "${VERSION}" 2>&1 | tee -a "${CI_LOG_DIR}/pin.log"
          git add .github/upstream-pin.conf
          if git diff --cached --quiet; then
            # A recovery for a release whose merge already happened: the base branch
            # carries the pin, so there is nothing to commit. The failed run's branch was
            # deleted by the squash merge, so the branch is recreated at the base tip; the
            # downstream jobs then check out a tree that already carries the pin and the
            # lockfiles, derive the same lockfiles and commit nothing.
            echo "the base already pins ${VERSION}; recreating ${branch} at ${base}"
            git fetch --no-tags origin "refs/heads/${base}"
            git checkout -B "${branch}" "origin/${base}"
            git push --force-with-lease="${branch}:" "${remote}" "HEAD:refs/heads/${branch}" 2>/dev/null \
              || git push "${remote}" "HEAD:refs/heads/${branch}"
            printf 'branch=%s\n' "${branch}" >>"${GITHUB_OUTPUT}"
            printf 'base=%s\n' "${base}" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          git commit -m "chore(ci): pin upstream ${VERSION}"
          # A re-run replaces the branch it created last time. --force-with-lease needs to
          # know what it is replacing, and a fresh checkout does not have the remote ref,
          # so it is fetched first; a branch that does not exist yet is simply pushed.
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/${branch}"
            git push --force-with-lease="${branch}:refs/remotes/origin/${branch}" \
              "${remote}" "HEAD:refs/heads/${branch}"
          else
            git push "${remote}" "HEAD:refs/heads/${branch}"
          fi
          printf 'branch=%s\n' "${branch}" >>"${GITHUB_OUTPUT}"
          printf 'base=%s\n' "${base}" >>"${GITHUB_OUTPUT}"

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.push.outputs.branch }}
          BASE: ${{ steps.push.outputs.base }}
          VERSION: ${{ needs.detect.outputs.version }}
          # The renderer reads the CI_ names: they are the same keys a local run exports.
          CI_UPSTREAM_VERSION: ${{ needs.detect.outputs.version }}
          CI_PREVIOUS_PIN: ${{ needs.detect.outputs.current_pin }}
          CI_MATRIX_CANDIDATES: ${{ needs.detect.outputs.candidates }}
          CI_MATRIX_GAPS: ${{ needs.detect.outputs.gaps }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/ci/upstream-watch.sh pr-body --out "${RUNNER_TEMP}/pr-body.md" 2>&1 | tee -a "${CI_LOG_DIR}/pr.log"
          # Re-runs reuse the open PR instead of failing on "a pull request already exists".
          pr="$(gh pr list --head "${BRANCH}" --base "${BASE}" --state open --json number --jq '.[0].number' || true)"
          if [ -n "${pr}" ] && [ "${pr}" != "null" ]; then
            gh pr edit "${pr}" --title "chore(ci): pin upstream ${VERSION}" --body-file "${RUNNER_TEMP}/pr-body.md"
          else
            gh pr create --head "${BRANCH}" --base "${BASE}" \
              --title "chore(ci): pin upstream ${VERSION}" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
            pr="$(gh pr list --head "${BRANCH}" --base "${BASE}" --state open --json number --jq '.[0].number')"
          fi
          [ -n "${pr}" ] && [ "${pr}" != "null" ] || { echo "the pull request was not created" >&2; exit 1; }
          printf 'pr=%s\n' "${pr}" >>"${GITHUB_OUTPUT}"
          echo "pull request ${pr} on ${BRANCH} -> ${BASE}"

  # The pipeline the release is published from: the same ci.yml every push runs, in this
  # same run, with the new upstream release as its input. Nothing here is a second copy of
  # that graph, and nothing waits for a push or a tag to start it.
  build:
    name: build the new upstream release
    needs: [detect, bump]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
    with:
      upstream_version: ${{ needs.detect.outputs.version }}
      # Every stage, explicitly. ci.yml skips the stages it was not asked for whenever the
      # triggering event is a workflow_dispatch - and it is, because a rehearsal is
      # dispatched and a scheduled run inherits whatever fired it. Without this line the
      # whole build was skipped (S1-S5 and assemble all reported "skipped"), the run went
      # green, and publish then failed with "Artifact not found for name: image-install"
      # (run 43789908639). The automatic release exists to publish a built image, so it
      # asks for the whole pipeline by name instead of relying on a default.
      stage: all

  # The three lockfiles are contracts for one upstream release; a new release needs its
  # own. They are derived with the same scripts the pipeline uses, committed to the branch,
  # and then *asserted* with CI_LOCK_STRICT=1 - which is the only way to prove the merged
  # tree, not just the built one, agrees with the pin.
  locks:
    name: move the lockfiles onto the new release
    needs: [detect, bump, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.bump.outputs.branch }}
          persist-credentials: false
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci
        with: {apt: "cpio kmod"}
      # The upstream files the pipeline fetched: the same bytes the modules and the runtime
      # closure were derived from.
      - name: Download the upstream files the build used
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-files
          path: ${{ runner.temp }}/ci/fetch

      # The kmods directory name and the release URL only exist once resolve.sh has run, so
      # this step wires them through ci_load_env_file: it exports every stage output as
      # CI_<UPPERCASE>, which is the same wiring a local reproduction gets. ci-debug.yml is
      # the other file that needs it, for the same reason.
      - name: Derive the lockfiles for this upstream release
        id: derive
        env:
          CI_UPSTREAM_VERSION: ${{ needs.detect.outputs.version }}
          CI_OUTPUT_ENV: ${{ runner.temp }}/ci/locks/derive.env
          # The fetch stage stores the rootfs under its payload-contract name, in its
          # upstream/ subdirectory.
          CI_ROOTFS_TAR: ${{ runner.temp }}/ci/fetch/upstream/rootfs.tar.gz
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/lib.sh
          . scripts/ci/lib.sh
          bash scripts/ci/resolve.sh >"${CI_LOG_DIR}/resolve.log" 2>&1
          ci_load_env_file "${CI_OUTPUT_ENV}"
          [ -n "${CI_KMODS_DIR:-}" ] || { echo "resolve.sh produced no kmods_dir" >&2; exit 1; }
          [ -f "${CI_ROOTFS_TAR}" ] || {
            echo "the upstream files carry no rootfs.tar.gz at ${CI_ROOTFS_TAR}" >&2
            exit 1
          }
          bash scripts/ci/kmods.sh --write-lock 2>&1 | tee -a "${CI_LOG_DIR}/locks.log"
          bash scripts/ci/platform-runtime.sh --write-lock 2>&1 | tee -a "${CI_LOG_DIR}/locks.log"
          bash scripts/ci/initramfs-tools.sh --write-lock 2>&1 | tee -a "${CI_LOG_DIR}/locks.log"
          git status --short

      - name: Commit the lockfiles to the branch
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "upstream-watch[bot]"
          git config user.email "upstream-watch@users.noreply.github.com"
          git add scripts/ci/kmod-closure.json scripts/ci/runtime-closure.json scripts/ci/initramfs-tools.lock.json
          if git diff --cached --quiet; then
            echo "the lockfiles already describe ${VERSION}"
          else
            git commit -m "chore(ci): move the lockfiles onto upstream ${VERSION}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          fi

      # The committed lockfiles are now the contract for this release: assert them, with the
      # pin contract in force, exactly as the next build on main will.
      - name: Assert the committed lockfiles
        env:
          CI_UPSTREAM_VERSION: ${{ needs.detect.outputs.version }}
          CI_LOCK_STRICT: "1"
          CI_OUTPUT_ENV: ${{ runner.temp }}/ci/locks/strict.env
          # The fetch stage stores the rootfs under its payload-contract name, in its
          # upstream/ subdirectory.
          CI_ROOTFS_TAR: ${{ runner.temp }}/ci/fetch/upstream/rootfs.tar.gz
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/lib.sh
          . scripts/ci/lib.sh
          bash scripts/ci/resolve.sh >"${CI_LOG_DIR}/resolve-strict.log" 2>&1
          ci_load_env_file "${CI_OUTPUT_ENV}"
          # CI_LOCK_STRICT=1 is what makes these three assertions mean "the committed
          # lockfiles belong to this release" instead of "a derived copy was used".
          bash scripts/ci/kmods.sh 2>&1 | tee -a "${CI_LOG_DIR}/locks-strict.log"
          bash scripts/ci/platform-runtime.sh 2>&1 | tee -a "${CI_LOG_DIR}/locks-strict.log"
          # The assert toolset stages the boot closure from the *committed* lockfile: a
          # file whose digest the lockfile does not name fails here, in this run, before
          # anything is merged.
          mkdir -p "${RUNNER_TEMP}/ci/assert-stage"
          bash scripts/ci/initramfs-tools.sh --toolset assert --stage "${RUNNER_TEMP}/ci/assert-stage" \
            2>&1 | tee -a "${CI_LOG_DIR}/locks-strict.log"

  # Squash, not a merge commit: the branch is one automatic change, and a revert of one
  # commit is the rollback.
  merge:
    name: merge and tag
    needs: [detect, bump, build, locks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ needs.detect.outputs.version }}
    # The rehearsal switch lives at job level so the two steps that would publish cannot
    # read it as anything but a boolean string: an `if:` on the step reads `env`, not
    # `inputs`, and `inputs.dry-run` on a schedule run is empty rather than "false".
    env:
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      # The diff guard compares two branches, which a shallow clone cannot do: without the
      # full history `git diff base...branch` fails with "no merge base". Tags are fetched
      # too, because the idempotency check compares the pushed tag with the merge commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci

      # The one already-happened check, and it now answers two questions instead of one:
      # whether the base branch already carries this pin (skip the squash) and whether the
      # remote tag already names the merge commit (skip the tag). Both halves of the
      # idempotency are needed, because a failure can land between them. `merge-state` only
      # reads; nothing is written before the diff guard.
      - name: Read the merge state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ inputs.base || 'main' }}
          VERSION: ${{ needs.detect.outputs.version }}
          BRANCH: auto/upstream-${{ needs.detect.outputs.version }}
          PR: ${{ needs.bump.outputs.pr }}
          CI_BASE: ${{ inputs.base || 'main' }}
          CI_UPSTREAM_VERSION: ${{ needs.detect.outputs.version }}
          CI_BRANCH: auto/upstream-${{ needs.detect.outputs.version }}
          CI_PR: ${{ needs.bump.outputs.pr }}
          CI_REMOTE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          bash scripts/ci/upstream-watch.sh merge-state "${VERSION}" 2>&1 | tee -a "${CI_LOG_DIR}/merge-state.log"
          if [ "$(git rev-parse --verify --quiet "refs/remotes/origin/${BASE}" >/dev/null && echo ok || echo no)" = "no" ]; then
            echo "could not read origin/${BASE}: the merge state cannot be decided" >&2
            exit 1
          fi

      # What was built is what gets merged: the branch may carry the pin and the three
      # lockfiles and nothing else. A workflow that quietly touches a fourth file has
      # published something nobody built.
      - name: Guard the diff
        if: steps.state.outputs.skip_merge != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          BASE: ${{ needs.bump.outputs.base }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE}" "${BRANCH}"
          changed="$(git diff --name-only "origin/${BASE}...origin/${BRANCH}" | LC_ALL=C sort)"
          allowed=".github/upstream-pin.conf
          scripts/ci/initramfs-tools.lock.json
          scripts/ci/kmod-closure.json
          scripts/ci/runtime-closure.json"
          unexpected="$(printf '%s\n' "${changed}" | grep -vxF -f <(printf '%s\n' "${allowed}") || true)"
          if [ -n "${unexpected}" ]; then
            echo "the automatic branch changes files a build did not prove:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          printf 'the automatic branch changes exactly:\n%s\n' "${changed}"

      # The two steps that publish are the two a rehearsal may not perform. They are gated
      # on `env.DRY_RUN` rather than skipped by a job-level `if:`, so the rehearsal still
      # runs the state check, the diff guard and the build, and the run page says why the
      # step did not merge.
      - name: Squash merge the pull request
        if: steps.state.outputs.skip_merge != 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.bump.outputs.pr }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          gh pr merge "${PR}" --squash --delete-branch \
            --subject "chore(ci): pin upstream ${VERSION}" \
            --body "Automatic upstream release: pin ${VERSION}, lockfiles moved, build green."
          gh pr view "${PR}" --json state,mergedAt --jq '.state + " " + (.mergedAt // "")'

      - name: Report the skipped squash merge
        if: steps.state.outputs.skip_merge == 'true' || env.DRY_RUN == 'true'
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          SKIP_MERGE: ${{ steps.state.outputs.skip_merge }}
        run: |
          set -euo pipefail
          if [ "${SKIP_MERGE}" = "true" ]; then
            reason="the base branch already pins ${VERSION}"
          else
            reason="dry run: a rehearsal may not merge"
          fi
          echo "skipping the squash merge of ${VERSION}: ${reason}"
          {
            printf '## Merge skipped\n\n'
            printf 'The squash merge of `%s` was not performed: %s.\n' "${VERSION}" "${reason}"
            printf 'The build and the lockfiles were still verified in this run.\n'
          } >>"${GITHUB_STEP_SUMMARY}"

      # A bare X.Y.Z tag: the release is identified by the system version, and a bare tag
      # never matches the v* line, so tagging cannot start a second release.
      - name: Tag the merged commit
        if: steps.state.outputs.skip_tag != 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          BASE: ${{ needs.bump.outputs.base }}
          PR: ${{ needs.bump.outputs.pr }}
          VERSION: ${{ needs.detect.outputs.version }}
          MERGED_SHA: ${{ steps.state.outputs.merged_sha }}
        run: |
          set -euo pipefail
          case "${VERSION}" in
            v*) echo "refusing to tag ${VERSION}: the automatic line publishes bare versions" >&2; exit 1 ;;
          esac
          # The merge commit the API reports, not whatever the base branch happens to point
          # at by now: a concurrent push must not become the tagged release. A recovery run
          # has no pull request of its own, so it reads the commit `detect` already resolved
          # from the same API, and refuses to guess when neither is known.
          if [ -n "${MERGED_SHA}" ]; then
            sha="${MERGED_SHA}"
          elif [ -n "${PR}" ] && [ "${PR}" != "null" ]; then
            sha="$(gh pr view "${PR}" --json mergeCommit --jq '.mergeCommit.oid')"
          else
            echo "no merge commit for ${VERSION}: pass a version whose pull request is known" >&2
            exit 1
          fi
          [ -n "${sha}" ] && [ "${sha}" != "null" ] || { echo "the merged pull request reports no merge commit" >&2; exit 1; }
          # An existing tag is never moved. `merge-state` already hard-fails a tag that
          # names another commit; this is the last line of defence against a race.
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            existing="$(git ls-remote --tags origin "refs/tags/${VERSION}^{}" "refs/tags/${VERSION}" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
            [ -n "${existing}" ] || existing="$(git ls-remote --tags origin "refs/tags/${VERSION}" | awk '{ print $1; exit }')"
            if [ "${existing}" = "${sha}" ]; then
              echo "tag ${VERSION} already names ${sha}; nothing to do"
              exit 0
            fi
            echo "tag ${VERSION} points at ${existing}, not at ${sha}: tags are immutable, refusing to force one" >&2
            exit 1
          fi
          git fetch --no-tags origin "${sha}"
          git config user.name "upstream-watch[bot]"
          git config user.email "upstream-watch@users.noreply.github.com"
          git tag -a "${VERSION}" -m "ImmortalWrt ${VERSION} through the N5105 A/B pipeline" "${sha}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${VERSION}"
          echo "tagged ${sha} as ${VERSION}"

      - name: Report the skipped tag
        if: steps.state.outputs.skip_tag == 'true' || env.DRY_RUN == 'true'
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          SKIP_TAG: ${{ steps.state.outputs.skip_tag }}
          TAG_SHA: ${{ steps.state.outputs.tag_sha }}
          MERGED_SHA: ${{ steps.state.outputs.merged_sha }}
        run: |
          set -euo pipefail
          if [ "${SKIP_TAG}" = "true" ]; then
            reason="tag ${VERSION} already names the merge commit ${MERGED_SHA:-${TAG_SHA}}"
          else
            reason="dry run: a rehearsal may not push a tag"
          fi
          echo "skipping the tag of ${VERSION}: ${reason}"
          {
            printf '## Tag skipped\n\n'
            printf 'The tag `%s` was not pushed: %s.\n' "${VERSION}" "${reason}"
            printf 'A rehearsal still publishes a draft release from the build artifacts.\n'
          } >>"${GITHUB_STEP_SUMMARY}"

  # Same implementation as the v* release line, same preflight: the two lines cannot drift.
  publish:
    name: publish
    needs: [detect, merge]
    permissions:
      contents: write
      # release-publish.yml's job reads the build artifacts through the API, so the caller
      # has to grant it; a called job may not request more than its caller allows.
      actions: read
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.detect.outputs.version }}
      tag-policy: bare
      extra-notes: ${{ needs.detect.outputs.candidates }}
      dry-run: ${{ inputs.dry-run }}

  # A red run has to leave one place to look. The title is stable per upstream version, so
  # a second failure updates the issue instead of opening another one.
  issue:
    name: report the failure
    needs: [detect, heartbeat, bump, build, locks, merge, publish]
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
          CHANGED: ${{ needs.detect.outputs.changed }}
          BUMP: ${{ needs.bump.result }}
          BUILD: ${{ needs.build.result }}
          LOCKS: ${{ needs.locks.result }}
          MERGE: ${{ needs.merge.result }}
          PUBLISH: ${{ needs.publish.result }}
          PR: ${{ needs.bump.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_UPSTREAM_VERSION: ${{ needs.detect.outputs.version }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # What the recovery contract needs: whether this was a resume, and what the base
          # branch, the merge commit and the tag already say. A failure after the merge must
          # not be reported as "nothing was touched", so the body is chosen from these.
          CI_MODE: ${{ needs.detect.outputs.mode }}
          # Empty on every other failure: the renderer only changes its opening sentence and
          # its reason row when discovery itself is what failed.
          CI_DETECT_ERROR: ${{ needs.detect.outputs.detect-error }}
          CI_RESUME_STAGE: ${{ needs.detect.outputs.resume-stage }}
          CI_PIN_IN_BASE: ${{ needs.detect.outputs.pin-in-base }}
          CI_MERGED_SHA: ${{ needs.detect.outputs.merged-sha }}
          CI_TAG_EXISTS: ${{ needs.detect.outputs.tag-exists }}
          CI_TAG_SHA: ${{ needs.detect.outputs.tag-sha }}
        run: |
          set -euo pipefail
          failed=""
          for pair in "bump:${BUMP}" "build:${BUILD}" "locks:${LOCKS}" "merge:${MERGE}" "publish:${PUBLISH}"; do
            job="${pair%%:*}"; result="${pair#*:}"
            case "${result}" in
              failure|cancelled) failed="${failed} ${job}" ;;
            esac
          done
          failed="${failed# }"
          [ -n "${failed}" ] || failed="detect"
          title="[auto-release] ${VERSION:-unknown}"
          # The detect failure carries its own reason; every other stage only has its name,
          # so it points at the run page.
          if [ -n "${CI_DETECT_ERROR:-}" ]; then
            auto_reason="${CI_DETECT_ERROR}"
          else
            auto_reason="${failed} failed; see the run page and the log"
          fi
          CI_AUTO_FAILED_STAGE="${failed}" CI_AUTO_REASON="${auto_reason}" \
            bash scripts/ci/upstream-watch.sh issue-body --out "${RUNNER_TEMP}/issue.md" 2>&1 \
            | tee -a "${CI_LOG_DIR}/issue.log"
          {
            printf '\n## Jobs\n\n| job | result |\n| --- | --- |\n'
            printf '| bump | %s |\n| build | %s |\n| locks | %s |\n| merge | %s |\n| publish | %s |\n\n' \
              "${BUMP}" "${BUILD}" "${LOCKS}" "${MERGE}" "${PUBLISH}"
            # The sentence has to match the state: after the merge it is no longer true that
            # the release stopped before publishing, and saying so would hide the tag.
            if [ "${CI_PIN_IN_BASE:-}" = "${VERSION}" ] || [ "${CI_TAG_EXISTS:-false}" = "true" ]; then
              printf 'The merge already landed for %s; the recovery scripts above decide what is left.\n' "${VERSION:-unknown}"
            else
              printf 'The automatic release stopped before merging. Nothing was published for %s.\n' "${VERSION:-unknown}"
            fi
          } >>"${RUNNER_TEMP}/issue.md"
          gh label create auto-release --color BFD4F2 --description "Automatic upstream release" 2>/dev/null || true
          existing="$(gh issue list --label auto-release --state open --json number,title \
            --jq "[.[] | select(.title == \"${title}\")][0].number" || true)"
          if [ -n "${existing}" ] && [ "${existing}" != "null" ]; then
            gh issue comment "${existing}" --body-file "${RUNNER_TEMP}/issue.md"
            echo "updated issue #${existing}"
          else
            gh issue create --title "${title}" --body-file "${RUNNER_TEMP}/issue.md" --label auto-release
          fi
          {
            printf '## Automatic upstream release failed\n\n'
            printf '| field | value |\n| --- | --- |\n'
            printf '| version | `%s` |\n' "${VERSION:-unknown}"
            printf '| failed jobs | `%s` |\n' "${failed}"
            printf '| run | %s |\n' "${RUN_URL}"
          } >>"${GITHUB_STEP_SUMMARY}"
          exit 1
