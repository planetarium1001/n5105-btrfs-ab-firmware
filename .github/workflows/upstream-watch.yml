name: upstream watch

# The daily upstream watch: one run that discovers a new upstream formal release, builds it
# through the ordinary pipeline, moves the pin, merges and publishes - and proves nothing
# happened when there is nothing new.
#
# Why everything is one run: a commit or tag pushed with GITHUB_TOKEN does NOT trigger a
# workflow (GitHub's recursion guard). "Push the bump, let CI build it, let the tag release
# it" is therefore not a design that can work; the discovery, the build, the merge, the tag
# and the publish all have to happen inside this run graph.
#
#   detect ─┬─ heartbeat (no update, due)                          -> done, success
#           └─ bump -> build -> locks -> merge -> publish         -> done, success
#                            └─ any failure -> issue              -> done, failure
#
# The build runs ci.yml through `workflow_call` with `upstream_version`, so the branch and
# this run cannot disagree about which upstream release is being built; the PR carries only
# data (the pin and the three lockfiles) and `merge` asserts exactly that before merging.
#
# A run with nothing new ends successfully and touches nothing: that is the ordinary
# outcome of most days, not a failure.

on:
  # TEMPORARY REHEARSAL TRIGGER - not part of the deliverable.
  # GitHub only dispatches or schedules a workflow that exists on the default branch, so
  # this file cannot be triggered at all while it lives on a work branch. A push trigger on
  # the work branch is the only way to run it before it is merged; the next commit removes
  # this block and restores the empty defaults below.
  push:
    branches: [wf/20261112-02-upstream-auto-release-main]
  schedule:
    # 20:00 UTC = 04:00 in Beijing: after the upstream mirrors settle for the day and
    # outside the hours anyone here dispatches a build by hand.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Treat this upstream version as the new release (rehearsal only; empty means discover it)"
        type: string
        default: "25.12.1"
      dry-run:
        description: "Rehearse: merge into a scratch branch and publish a draft release"
        type: boolean
        default: true
      base:
        description: "Branch the PR is opened against and merged into"
        type: string
        default: "auto/dryrun-main"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # What is published has to be what was proved, so every job that writes says what it
  # writes and nothing else.
  detect:
    name: detect a new upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
      current_pin: ${{ steps.detect.outputs.current_pin }}
      candidates: ${{ steps.matrix.outputs.candidates }}
      gaps: ${{ steps.matrix.outputs.gaps }}
      heartbeat: ${{ steps.heartbeat.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci

      - name: Detect the newest upstream formal release
        id: detect
        env:
          CI_FORCE_VERSION: ${{ inputs.version || '25.12.1' }}
        run: bash scripts/ci/upstream-watch.sh detect 2>&1 | tee -a "${CI_LOG_DIR}/detect.log"

      # The candidates are the new release plus the three formal releases before it. They
      # are recorded in the PR, the run summary and the release notes; they do not add
      # pipeline runs, because the multi-version matrix is a device-side concern.
      - name: Select the matrix candidates
        id: matrix
        if: ${{ steps.detect.outputs.changed == 'true' }}
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: bash scripts/ci/matrix-select.sh --version "${VERSION}" 2>&1 | tee -a "${CI_LOG_DIR}/matrix.log"

      - name: Decide whether a heartbeat tag is due
        id: heartbeat
        env:
          CI_MATRIX_CANDIDATES: ${{ steps.matrix.outputs.candidates }}
        run: bash scripts/ci/heartbeat-tag.sh --dry-run 2>&1 | tee -a "${CI_LOG_DIR}/heartbeat.log"

  # A scheduled workflow in a public repository is disabled after 60 days without
  # repository activity, and a disabled watch is a silent auto-release outage. The tag is
  # activity; its name never matches v*, so it can never trigger the release line either.
  heartbeat:
    name: heartbeat tag
    needs: detect
    if: ${{ needs.detect.outputs.changed != 'true' && needs.detect.outputs.heartbeat == 'would-create' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci
      - name: Create the heartbeat tag
        id: heartbeat
        run: bash scripts/ci/heartbeat-tag.sh 2>&1 | tee -a "${CI_LOG_DIR}/heartbeat.log"

      - name: Push the heartbeat tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.heartbeat.outputs.tag }}
          ACTION: ${{ steps.heartbeat.outputs.action }}
        run: |
          set -euo pipefail
          [ "${ACTION}" = "created" ] || { echo "no heartbeat tag to push (${ACTION})"; exit 0; }
          [ -n "${TAG}" ] || { echo "heartbeat-tag.sh reported no tag" >&2; exit 1; }
          case "${TAG}" in
            v*) echo "refusing to push ${TAG}: a v* tag would trigger the release line" >&2; exit 1 ;;
          esac
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"

  # The automatic change is a branch and a pull request, never a push to main: every
  # automatic change keeps an auditable diff and a rollback point.
