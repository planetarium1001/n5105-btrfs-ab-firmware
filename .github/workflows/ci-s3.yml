name: S3 boot

# Stage S3 - layered boot on a version-named writable layer.
#
# Replaces the S1 probe initramfs with the real boot initramfs: read the slot state from the
# ESP, mount the writable layer first, then the read-only layers, compose the overlay root and
# switch_root into it. Boot 1 proves the composition order, boot 2 that the same root comes
# back with boot 1's writes, boot 3 that the firmware path works (OVMF runs GRUB from the ESP
# and GRUB picks the entry ab-slot.cfg names).
#
#     S3-RESULT=ok slot=<a|b> upper=<@overlay-version> lower=<platform:sys> root=<overlay>

on:
  workflow_call:
    inputs:
      upstream_version: {description: "Resolved upstream version", required: true, type: string}
      upstream_base_url: {description: "Release directory URL for the target", required: true, type: string}
      kmods_dir: {description: "Kernel module directory name on the mirror", required: true, type: string}
      kernel_package: {description: "Kernel package version from the upstream manifest", required: true, type: string}
      platform_version: {description: "Platform version from the repository VERSION file", required: true, type: string}
      variant: {description: "Build the convenience image (WAN SSH open) instead of the default one", required: false, type: boolean, default: false}
      boots: {description: "Run the boot assertions (the convenience variant only needs the image)", required: false, type: boolean, default: true}
    outputs:
      judge_line: {description: "Frozen S3 judge line from the first boot", value: "${{ jobs.s3.outputs.judge_line }}"}
      judge_line_boot2: {description: "Frozen S3 judge line from the second boot", value: "${{ jobs.s3.outputs.judge_line_boot2 }}"}
      slot: {description: "Slot the boot chain selected", value: "${{ jobs.s3.outputs.slot }}"}
      upper: {description: "Writable layer the boot chain mounted, for example @overlay-25.12.2", value: "${{ jobs.s3.outputs.upper }}"}
      grub_boot_line: {description: "Boot hook evidence line from the firmware/GRUB boot", value: "${{ jobs.s3.outputs.grub_boot_line }}"}
      module_count: {description: "Modules unpacked into the boot initramfs", value: "${{ jobs.s3.outputs.module_count }}"}

permissions:
  contents: read

jobs:
  s3:
    name: S3 boot - layered root
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      CI_UPSTREAM_BASE_URL: ${{ inputs.upstream_base_url }}
      CI_KMODS_DIR: ${{ inputs.kmods_dir }}
      CI_KERNEL_PACKAGE: ${{ inputs.kernel_package }}
      CI_PLATFORM_VERSION: ${{ inputs.platform_version }}
      # One knob, derived: asking for the variant *is* asking for the open WAN. Two
      # independent inputs could disagree and publish an open image under the default
      # name, which is the one mistake this pair must make impossible.
      CI_NET_WAN_SSH: ${{ inputs.variant && 'open' || 'closed' }}
    outputs:
      judge_line: ${{ steps.boot1.outputs.judge_line }}
      judge_line_boot2: ${{ steps.boot2.outputs.judge_line }}
      slot: ${{ steps.judge.outputs.slot }}
      upper: ${{ steps.judge.outputs.upper }}
      module_count: ${{ steps.kmods.outputs.module_count }}
      grub_boot_line: ${{ steps.judge_grub.outputs.device_line }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci
        with:
          download-upstream: "true"
          apt: btrfs-progs dosfstools gdisk util-linux cpio kmod qemu-system-x86 ovmf grub-common

      # The ESP needs vfat, so the closure carries the vfat and nls modules next to btrfs.
      - name: Unpack the btrfs and vfat module closure
        id: kmods
        uses: ./.github/actions/run-stage-script
        with: {script: kmods.sh}

      - name: Prepare the ESP from the upstream bootloader
        id: esp
        uses: ./.github/actions/run-stage-script
        with: {script: esp-prepare.sh, log: esp.log}

      # Production: AB_CI_HOOKS stays unset, so /s3-post.sh is not injected into the image.
      - name: Build the boot initramfs
        id: initramfs
        env:
          CI_KERNEL_VERSION: ${{ steps.kmods.outputs.kernel_version }}
          CI_INITRAMFS_OUT: ${{ runner.temp }}/ci/initramfs/boot.cpio.gz
          CI_INIT_SCRIPT: ${{ github.workspace }}/initramfs/boot/init
        run: |
          extra="${GITHUB_WORKSPACE}/initramfs/lib/wf.sh:/lib/wf.sh"
          if [ "${AB_CI_HOOKS:-0}" = "1" ]; then
            extra="${extra} ${GITHUB_WORKSPACE}/initramfs/boot/post.sh:/s3-post.sh"
          fi
          CI_EXTRA_FILES="${extra}" bash scripts/ci/initramfs.sh 2>&1 \
            | tee -a "${CI_LOG_DIR}/initramfs.log"

      # The kernel boots need the guest assertion; it gets its own initramfs and never leaves here.
      - name: Build the CI assertion initramfs
        id: initramfs_ci
        env:
          CI_KERNEL_VERSION: ${{ steps.kmods.outputs.kernel_version }}
          CI_INITRAMFS_OUT: ${{ runner.temp }}/ci/initramfs/ci-hooks.cpio.gz
          CI_INIT_SCRIPT: ${{ github.workspace }}/initramfs/boot/init
          AB_CI_HOOKS: "1"
        run: |
          extra="${GITHUB_WORKSPACE}/initramfs/lib/wf.sh:/lib/wf.sh"
          if [ "${AB_CI_HOOKS:-0}" = "1" ]; then
            extra="${extra} ${GITHUB_WORKSPACE}/initramfs/boot/post.sh:/s3-post.sh"
          fi
          CI_EXTRA_FILES="${extra}" bash scripts/ci/initramfs.sh 2>&1 \
            | tee -a "${CI_LOG_DIR}/initramfs-ci-hooks.log"
          case "${extra}" in
            *:/s3-post.sh) ;;
            *)
              echo "::error::the assertion initramfs was built without /s3-post.sh, the kernel boots below could not assert anything"
              exit 1
              ;;
          esac

      # The platform layer carries btrfs-progs: the upstream rootfs has no btrfs tool.
      - name: Resolve the btrfs runtime closure
        id: runtime
        uses: ./.github/actions/run-stage-script
        with: {script: platform-runtime.sh, log: runtime.log}

      - name: Assemble the disk image
        id: disk
        env:
          CI_PLATFORM_RUNTIME_DIR: ${{ runner.temp }}/ci/runtime
          CI_INITRAMFS: ${{ steps.initramfs.outputs.initramfs_path }}
          CI_ESP_DIR: ${{ steps.esp.outputs.esp_dir }}
        run: bash scripts/ci/disk.sh 2>&1 | tee -a "${CI_LOG_DIR}/disk.log"

      # The third boot hands the machine to the firmware, so prove the ESP is bootable first.
      # Runs for the convenience image too: it is the only proof that artifact gets, and it
      # costs a GRUB parse rather than a boot.
      - name: Preflight - the ESP boots through GRUB
        id: verify0
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE}" 2>&1 | tee -a "${CI_LOG_DIR}/grub-preflight.log"

      - name: Boot 1 - compose the layered root
        if: ${{ inputs.boots }}
        id: boot1
        uses: ./.github/actions/qemu-boot
        with:
          case: s3-boot1
          initramfs: ${{ steps.initramfs_ci.outputs.initramfs_path }}
          image: ${{ steps.disk.outputs.image_path }}
          judge-prefix: S3-RESULT
          append-extra: wf.boot=1

      - name: Read the slot and layer from the judge line
        if: ${{ inputs.boots }}
        id: judge
        env:
          JUDGE_LINE: ${{ steps.boot1.outputs.judge_line }}
        run: |
          slot="$(printf '%s' "${JUDGE_LINE}" | sed -n 's/.*slot=\([ab]\).*/\1/p')"
          upper="$(printf '%s' "${JUDGE_LINE}" | sed -n 's/.*upper=\([^ ]*\).*/\1/p')"
          echo "slot=${slot:-unknown} upper=${upper:-unknown}"
          {
            printf 'slot=%s\n' "${slot}"
            printf 'upper=%s\n' "${upper}"
          } >>"${GITHUB_OUTPUT}"

      # Same image, nothing wiped: the first boot's probe must still be there.
      - name: Boot 2 - verify persistence
        if: ${{ inputs.boots }}
        id: boot2
        uses: ./.github/actions/qemu-boot
        with:
          case: s3-boot2
          initramfs: ${{ steps.initramfs_ci.outputs.initramfs_path }}
          image: ${{ steps.disk.outputs.image_path }}
          judge-prefix: S3-RESULT
          append-extra: wf.boot=2

      # No probe initramfs here: the run stops on the first line our own boot hook prints.
      - name: Boot 3 - the ESP boots through GRUB
        if: ${{ inputs.boots }}
        id: boot3
        uses: ./.github/actions/qemu-boot
        with:
          case: s3-grub
          mode: uefi-disk
          initramfs: ${{ steps.initramfs.outputs.initramfs_path }}
          image: ${{ steps.disk.outputs.image_path }}
          judge-prefix: ""
          stop-pattern: "^ab-boot: stage="

      # The evidence is the hook's own console output, not a probe-only artefact.
      - name: Assert the GRUB boot reached our boot hook
        if: ${{ inputs.boots }}
        id: judge_grub
        env:
          SERIAL: ${{ steps.boot3.outputs.serial_log }}
          BOOT1_SLOT: ${{ steps.judge.outputs.slot }}
        run: |
          if [ ! -f "${SERIAL}" ]; then
            echo "::error::no serial log from the GRUB boot"
            exit 1
          fi
          fail=0
          if ! grep -qE 'ab-boot: stage=device .*disk=/dev/vda' "${SERIAL}"; then
            echo "::error::the boot hook never identified the boot disk: our initramfs did not run, or the disk was not /dev/vda"
            fail=1
          fi
          if ! grep -q 'ab-boot: running slot' "${SERIAL}"; then
            echo "::error::the boot hook never reported a running slot"
            fail=1
          fi
          if ! grep -q "ab-boot: running slot ${BOOT1_SLOT:-a} " "${SERIAL}"; then
            echo "::error::the boot hook did not report slot ${BOOT1_SLOT:-a}, the slot the kernel boots used"
            fail=1
          fi
          if [ "${fail}" -ne 0 ]; then
            grep -E 'ab-boot:|ab-commit:|\[boot\]|S3-RESULT' "${SERIAL}" | tail -n 40 || tail -n 40 "${SERIAL}"
            exit 1
          fi
          grep -E 'ab-boot: (stage=device|running slot)' "${SERIAL}" | head -n 4
          {
            printf 'slot=%s\n' "${BOOT1_SLOT}"
            printf 'device_line=%s\n' "$(grep -m 1 'ab-boot: stage=device' "${SERIAL}")"
          } >>"${GITHUB_OUTPUT}"

      - name: Collect the stage evidence
        if: always()
        uses: ./.github/actions/stage-evidence
        with:
          stage: s3
          name: evidence-s3
          diag-args: ${{ runner.temp }}/ci/qemu
          paths: |
            ${{ runner.temp }}/ci/logs
            ${{ runner.temp }}/ci/qemu/qemu-*.out
            ${{ runner.temp }}/ci/initramfs/boot.cpio.gz
            ${{ runner.temp }}/ci/initramfs/ci-hooks.cpio.gz
            ${{ runner.temp }}/ci/disk/grub.cfg
            ${{ runner.temp }}/ci/disk/ab-slot.cfg

      # The image this stage built. Two literal names, one step each: an artifact name is
      # what a person reads in the run page, so it is spelled out rather than assembled
      # from an input (tests/modules/ci/test_display_names.sh holds that vocabulary).
      - name: Upload the install image
        if: success() && !inputs.variant
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-install
          path: ${{ runner.temp }}/ci/disk/*.img.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the convenience image
        if: success() && inputs.variant
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-install-wan-ssh
          path: ${{ runner.temp }}/ci/disk/*.img.gz
          if-no-files-found: warn
          retention-days: 7

      # The five-column block, rendered by bash scripts/ci/stage-summary.sh --stage s3.
      - name: Write stage summary
        if: always()
        uses: ./.github/actions/stage-summary
        with:
          stage: s3
          result: ${{ job.status }}
          artifact: ${{ inputs.variant && 'image-install-wan-ssh' || 'image-install' }}
          artifact-file: ${{ runner.temp }}/ci/disk/n5105-ab-image.img.gz
