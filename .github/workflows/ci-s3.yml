name: S3 boot

# Stage S3 - layered boot on a version-named writable layer.
#
# Replaces the S1 probe initramfs with the real boot initramfs: read the slot state
# from the ESP, mount the writable layer first, then the two read-only layers,
# compose the overlay root and switch_root into it. The image produced by S2 is
# attached as /dev/vda and booted twice without wiping it, so persistence across a
# reboot is part of the assertion.
#
# Boot 1 proves: the overlay root is composed in the documented order, @platform and @sys
# both contribute files, and probe writes land in <upper>/upper. Boot 2 proves
# the same root comes back with the first boot's writes still present.
#
# A third boot hands the machine to the firmware instead: QEMU starts no kernel of its
# own (CI_QEMU_MODE=uefi-disk), OVMF runs GRUB from the ESP, and GRUB picks the entry
# that /boot/grub/ab-slot.cfg names. That is the boot path a real machine takes and
# the one the two kernel boots above cannot prove.
#
# The three boots must print the frozen line:
#
#     S3-RESULT=ok slot=<a|b> upper=<@overlay-version> lower=<platform:sys> root=<overlay>
#
# The ESP needs vfat, which the upstream kernel does not build in, so the module
# closure carries kmod-fs-vfat, kmod-nls-base, kmod-nls-cp437 and
# kmod-nls-iso8859-1 next to the btrfs set.

on:
  workflow_call:
    inputs:
      upstream_version:
        description: "Resolved upstream version"
        required: true
        type: string
      upstream_base_url:
        description: "Release directory URL for the target"
        required: true
        type: string
      kmods_dir:
        description: "Kernel module directory name on the mirror"
        required: true
        type: string
      kernel_package:
        description: "Kernel package version from the upstream manifest"
        required: true
        type: string
      platform_version:
        description: "Platform version recorded in the @platform skeleton"
        required: false
        type: string
        default: "0.0.1"
    outputs:
      judge_line:
        description: "Frozen S3 judge line from the first boot"
        value: ${{ jobs.s3.outputs.judge_line }}
      judge_line_boot2:
        description: "Frozen S3 judge line from the second boot"
        value: ${{ jobs.s3.outputs.judge_line_boot2 }}
      slot:
        description: "Slot the boot chain selected"
        value: ${{ jobs.s3.outputs.slot }}
      upper:
        description: "Writable layer the boot chain mounted, for example @overlay-25.12.2"
        value: ${{ jobs.s3.outputs.upper }}
      grub_boot_line:
        description: "Boot hook evidence line from the firmware/GRUB boot"
        value: ${{ jobs.s3.outputs.grub_boot_line }}
      module_count:
        description: "Modules unpacked into the boot initramfs"
        value: ${{ jobs.s3.outputs.module_count }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  s3:
    name: S3 boot - layered root
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      CI_UPSTREAM_BASE_URL: ${{ inputs.upstream_base_url }}
      CI_KMODS_DIR: ${{ inputs.kmods_dir }}
      CI_KERNEL_PACKAGE: ${{ inputs.kernel_package }}
      CI_PLATFORM_VERSION: ${{ inputs.platform_version }}
    outputs:
      judge_line: ${{ steps.boot1.outputs.judge_line }}
      judge_line_boot2: ${{ steps.boot2.outputs.judge_line }}
      slot: ${{ steps.judge.outputs.slot }}
      upper: ${{ steps.judge.outputs.upper }}
      module_count: ${{ steps.kmods.outputs.module_count }}
      grub_boot_line: ${{ steps.judge_grub.outputs.device_line }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download upstream artifacts
        uses: actions/download-artifact@v4
        with:
          name: upstream-files
          path: ${{ runner.temp }}/ci/fetch

      - name: Install image and QEMU tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            btrfs-progs dosfstools gdisk util-linux cpio kmod qemu-system-x86 ovmf \
            grub-common
          mkfs.btrfs --version
          qemu-system-x86_64 --version | head -n 1

      - name: Unpack the btrfs and vfat module closure
        id: kmods
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/kmods.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/kmods.log"

      - name: Prepare the ESP from the upstream bootloader
        id: esp
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/esp-prepare.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/esp.log"

      # The initramfs the image carries: production, so AB_CI_HOOKS stays unset and
      # /s3-post.sh is not injected (this job deliberately does not read the repository
      # variable - the published image is always built without CI hooks). This is the
      # archive disk.sh installs as initrd-a/b and the one the published image boots;
      # scripts/ci/image-verify.sh refuses an initrd that carries an s3- member.
      - name: Build the boot initramfs
        id: initramfs
        env:
          CI_KERNEL_VERSION: ${{ steps.kmods.outputs.kernel_version }}
          CI_INITRAMFS_OUT: ${{ runner.temp }}/ci/initramfs/boot.cpio.gz
          CI_INIT_SCRIPT: ${{ github.workspace }}/initramfs/boot/init
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          extra="${GITHUB_WORKSPACE}/initramfs/lib/wf.sh:/lib/wf.sh"
          if [ "${AB_CI_HOOKS:-0}" = "1" ]; then
            extra="${extra} ${GITHUB_WORKSPACE}/initramfs/boot/post.sh:/s3-post.sh"
          fi
          CI_EXTRA_FILES="${extra}" bash scripts/ci/initramfs.sh 2>&1 \
            | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/initramfs.log"

      # The two kernel boots need the guest assertion, and the image must not have it: so
      # the assertion gets an initramfs of its own, built with AB_CI_HOOKS=1. Same /init
      # and same /lib as the production archive, the only difference is /s3-post.sh, and
      # it never leaves this job - the firmware boot below uses the image's own initrd.
      - name: Build the CI assertion initramfs
        id: initramfs_ci
        env:
          CI_KERNEL_VERSION: ${{ steps.kmods.outputs.kernel_version }}
          CI_INITRAMFS_OUT: ${{ runner.temp }}/ci/initramfs/ci-hooks.cpio.gz
          CI_INIT_SCRIPT: ${{ github.workspace }}/initramfs/boot/init
          AB_CI_HOOKS: "1"
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          extra="${GITHUB_WORKSPACE}/initramfs/lib/wf.sh:/lib/wf.sh"
          if [ "${AB_CI_HOOKS:-0}" = "1" ]; then
            extra="${extra} ${GITHUB_WORKSPACE}/initramfs/boot/post.sh:/s3-post.sh"
          fi
          CI_EXTRA_FILES="${extra}" bash scripts/ci/initramfs.sh 2>&1 \
            | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/initramfs-ci-hooks.log"
          case "${extra}" in
            *:/s3-post.sh) ;;
            *)
              echo "::error::the assertion initramfs was built without /s3-post.sh, the kernel boots below could not assert anything"
              exit 1
              ;;
          esac

      # The platform layer carries btrfs-progs: the upstream rootfs has no btrfs tool,
      # and reclamation, snapshots and the degraded boot need one inside the guest.
      - name: Resolve the btrfs runtime closure
        id: runtime
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/platform-runtime.sh 2>&1 \
            | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/runtime.log"

      - name: Assemble the disk image
        id: disk
        env:
          CI_PLATFORM_RUNTIME_DIR: ${{ runner.temp }}/ci/runtime
          CI_INITRAMFS: ${{ steps.initramfs.outputs.initramfs_path }}
          CI_ESP_DIR: ${{ steps.esp.outputs.esp_dir }}
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/disk.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/disk.log"

      # The firmware boots the ESP in the third boot below, so prove it is bootable
      # before running any of them.
      - name: Preflight - the ESP boots through GRUB
        id: verify0
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE}" 2>&1 \
            | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/grub-preflight.log"

      # Boot 1: compose the root and leave probe files behind.
      - name: Boot 1 - compose the layered root
        id: boot1
        env:
          CI_KERNEL: ${{ runner.temp }}/ci/fetch/upstream/kernel.bin
          CI_INITRAMFS: ${{ steps.initramfs_ci.outputs.initramfs_path }}
          CI_QEMU_DISK: ${{ steps.disk.outputs.image_path }}
          CI_JUDGE_PREFIX: S3-RESULT
          CI_QEMU_CASE: s3-boot1
          CI_QEMU_APPEND_EXTRA: wf.boot=1
          CI_QEMU_TIMEOUT: "900"
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/qemu-smoke.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/qemu-boot1.log"

      - name: Read the slot and layer from the judge line
        id: judge
        env:
          JUDGE_LINE: ${{ steps.boot1.outputs.judge_line }}
        run: |
          slot="$(printf '%s' "${JUDGE_LINE}" | sed -n 's/.*slot=\([ab]\).*/\1/p')"
          upper="$(printf '%s' "${JUDGE_LINE}" | sed -n 's/.*upper=\([^ ]*\).*/\1/p')"
          echo "slot=${slot:-unknown} upper=${upper:-unknown}"
          {
            printf 'slot=%s\n' "${slot}"
            printf 'upper=%s\n' "${upper}"
          } >>"${GITHUB_OUTPUT}"

      # Boot 2: same image, nothing wiped. The first boot's probe must still be there.
      - name: Boot 2 - verify persistence
        id: boot2
        env:
          CI_KERNEL: ${{ runner.temp }}/ci/fetch/upstream/kernel.bin
          CI_INITRAMFS: ${{ steps.initramfs_ci.outputs.initramfs_path }}
          CI_QEMU_DISK: ${{ steps.disk.outputs.image_path }}
          CI_JUDGE_PREFIX: S3-RESULT
          CI_QEMU_CASE: s3-boot2
          CI_QEMU_APPEND_EXTRA: wf.boot=2
          CI_QEMU_TIMEOUT: "900"
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/qemu-smoke.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/qemu-boot2.log"

      # Boot 3: the firmware runs GRUB, GRUB reads the runtime slot file and boots the
      # committed entry, and the production system starts. This boot does NOT run a
      # probe initramfs: there is no /s3.sh and no S3-RESULT line here, so the run stops
      # on the first line our own boot hook prints and grades what it reported.
      - name: Boot 3 - the ESP boots through GRUB
        id: boot3
        env:
          CI_KERNEL: ${{ runner.temp }}/ci/fetch/upstream/kernel.bin
          CI_INITRAMFS: ${{ steps.initramfs.outputs.initramfs_path }}
          CI_QEMU_DISK: ${{ steps.disk.outputs.image_path }}
          CI_QEMU_MODE: uefi-disk
          CI_JUDGE_PREFIX: ""
          CI_QEMU_STOP_PATTERN: "^ab-boot: stage="
          CI_QEMU_CASE: s3-grub
          CI_QEMU_TIMEOUT: "900"
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/qemu-smoke.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/qemu-boot3.log"

      # The boot that just happened was a real machine boot: the firmware found the ESP,
      # GRUB picked an entry, our initramfs composed the root and our own hook ran. The
      # evidence is the hook's own console output, not a probe that could only exist in
      # a test initramfs.
      - name: Assert the GRUB boot reached our boot hook
        id: judge_grub
        env:
          SERIAL: ${{ steps.boot3.outputs.serial_log }}
          BOOT1_SLOT: ${{ steps.judge.outputs.slot }}
        run: |
          if [ ! -f "${SERIAL}" ]; then
            echo "::error::no serial log from the GRUB boot"
            exit 1
          fi
          fail=0
          if ! grep -qE 'ab-boot: stage=device .*disk=/dev/vda' "${SERIAL}"; then
            echo "::error::the boot hook never identified the boot disk: our initramfs did not run, or the disk was not /dev/vda"
            fail=1
          fi
          if ! grep -q 'ab-boot: running slot' "${SERIAL}"; then
            echo "::error::the boot hook never reported a running slot"
            fail=1
          fi
          if ! grep -q "ab-boot: running slot ${BOOT1_SLOT:-a} " "${SERIAL}"; then
            echo "::error::the boot hook did not report slot ${BOOT1_SLOT:-a}, the slot the kernel boots used"
            fail=1
          fi
          if [ "${fail}" -ne 0 ]; then
            grep -E 'ab-boot:|ab-commit:|\[boot\]|S3-RESULT' "${SERIAL}" | tail -n 40 || tail -n 40 "${SERIAL}"
            exit 1
          fi
          grep -E 'ab-boot: (stage=device|running slot)' "${SERIAL}" | head -n 4
          {
            printf 'slot=%s\n' "${BOOT1_SLOT}"
            printf 'device_line=%s\n' "$(grep -m 1 'ab-boot: stage=device' "${SERIAL}")"
          } >>"${GITHUB_OUTPUT}"

      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        env:
          CI_DIAG_DIR: ${{ runner.temp }}/ci/diagnostics
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}" "${CI_DIAG_DIR}"
          bash scripts/ci/diagnostics.sh s3 "${CI_TMP_ROOT:-${RUNNER_TEMP}/ci}/qemu" 2>&1 \
            | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/diagnostics.log"

      # The image this stage actually booted: production initramfs, both slots, and the
      # only image a machine may be flashed with. It is what the release publishes; S2's
      # image-probe exists to test assembly and is never bootable outside QEMU.
      - name: Upload the install image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-install
          path: ${{ runner.temp }}/ci/disk/*.img.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-s3
          path: |
            ${{ runner.temp }}/ci/logs
            ${{ runner.temp }}/ci/qemu/qemu-*.out
            ${{ runner.temp }}/ci/initramfs/boot.cpio.gz
            ${{ runner.temp }}/ci/initramfs/ci-hooks.cpio.gz
            ${{ runner.temp }}/ci/disk/grub.cfg
            ${{ runner.temp }}/ci/disk/ab-slot.cfg
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-s3
          path: ${{ runner.temp }}/ci/diagnostics/summary.txt
          if-no-files-found: ignore
          retention-days: 7

      # The summary block is the run page the user reads: same five columns for every
      # stage, written even when the stage failed (if: always()).
      - name: Write stage summary
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/ci"
          cat "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"/*.log >"${RUNNER_TEMP}/ci/s3-judge.log" 2>/dev/null || true
          bash scripts/ci/stage-summary.sh \
            --stage s3 \
            --result "${{ job.status }}" \
            --judge-log "${RUNNER_TEMP}/ci/s3-judge.log" \
            --artifact image-install \
            --artifact-file "${RUNNER_TEMP}/ci/disk/n5105-ab-image.img.gz"
