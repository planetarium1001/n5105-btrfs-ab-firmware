name: Firmware CI - debug session

# MANUAL DEBUGGING ENTRY POINT -- NOT A DELIVERY PIPELINE STAGE.
#
# workflow_dispatch only, called by nothing, grades nothing: it runs the same scripts/ci/
# chain the stage workflows run (resolve -> fetch -> kmods -> esp-prepare ->
# platform-runtime -> initramfs -> disk, then optionally the payload, the fixtures and the
# first boot) and hands the runner to an upterm session. It exists because S4 and S5 grade a
# boot the guest cannot grade itself, and "the upgraded slot comes up and the health check
# never finishes" needs eyes on a live runner: on 2026-11-10 one s5 boot ate its whole 900 s
# budget, and a push-and-wait per hypothesis costs ~10 minutes.
#
# scripts/check_design.py ("debug-ssh") fails if this file ever gains a push trigger, a
# floating action ref or a session without a bound.

on:
  # workflow_dispatch only: anything else hands every contributor an interactive shell.
  workflow_dispatch:
    inputs:
      stage:
        description: "How far the session should prepare before the shell opens"
        type: choice
        options:
          - none
          - build-disk
          - s4
          - s5
        default: build-disk
      boot_timeout:
        description: "CI_QEMU_TIMEOUT for the optional first boot, in seconds"
        type: string
        default: "1200"

permissions:
  contents: read

# One interactive runner per lane and branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  # Debug sessions replace each other: queuing a second upterm session behind a 290-minute
  # one is the failure mode this entry point exists to avoid. The group is its own, so this
  # still never touches a push or another workflow's run.
  cancel-in-progress: true

jobs:
  debug:
    name: debug session
    runs-on: ubuntu-latest
    # The keep-alive step below holds the runner (150 min); the job cap sits above it.
    timeout-minutes: 290
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The platform version has one source: VERSION. Empty is a failure, never a default.
      - name: Read the platform version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [ -n "${version}" ] || { echo "::error::VERSION is empty"; exit 1; }
          printf 'CI_PLATFORM_VERSION=%s\n' "${version}" >>"${GITHUB_ENV}"

      - name: Install the image, QEMU and loopback tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            btrfs-progs dosfstools gdisk util-linux cpio kmod qemu-system-x86 \
            ovmf grub-common zstd curl
          mkfs.btrfs --version
          qemu-system-x86_64 --version | head -n 1
          losetup --version | head -n 1

      # Facts first: /dev/kvm is absent on a standard runner and QEMU runs -accel tcg anyway.
      - name: Report the runner
        run: |
          uname -srm
          printf 'cpus=%s\n' "$(nproc)"
          free -m | head -n 2
          systemd-detect-virt || true
          if [ -w /dev/kvm ]; then
            echo "/dev/kvm is writable: this runner exposes KVM"
          else
            echo "no usable /dev/kvm: QEMU runs under TCG, as in CI"
          fi
          df -h "${RUNNER_TEMP}" | tail -n 1
          sudo -n true && echo "passwordless sudo: yes" || echo "passwordless sudo: NO"

      # A workflow-level `${{ runner.temp }}` is a parse error: it is exported here, in a step.
      - name: Export the scratch layout
        run: |
          {
            printf 'CI_TMP_ROOT=%s\n' "${RUNNER_TEMP}/ci"
            printf 'CI_LOG_DIR=%s\n' "${RUNNER_TEMP}/ci/logs"
            # The defaults of fetch.sh, initramfs.sh and disk.sh.
            printf 'CI_DEBUG_KERNEL=%s\n' "${RUNNER_TEMP}/ci/fetch/upstream/kernel.bin"
            printf 'CI_DEBUG_INITRAMFS=%s\n' "${RUNNER_TEMP}/ci/initramfs/boot.cpio.gz"
            printf 'CI_DEBUG_IMAGE=%s\n' "${RUNNER_TEMP}/ci/disk/n5105-ab-image.img"
          } >>"${GITHUB_ENV}"

      # The ci-s4/ci-s5 chain, stopped at the disk image. Not fatal: the human gets the shell.
      - name: Prepare the disk image and every input it needs
        id: prepare
        if: ${{ inputs.stage != 'none' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${CI_TMP_ROOT}" "${CI_LOG_DIR}"
          log="${CI_LOG_DIR}/debug-prepare.log"
          # shellcheck source=scripts/ci/lib.sh
          . scripts/ci/lib.sh

          CI_OUTPUT_ENV="${CI_TMP_ROOT}/resolve.env" \
            bash scripts/ci/resolve.sh 2>&1 | tee -a "${log}"
          ci_load_env_file "${CI_TMP_ROOT}/resolve.env"

          # $GITHUB_ENV is the only channel that reaches the steps below.
          while IFS='=' read -r key value; do
            [ -n "${key}" ] || continue
            printf 'CI_%s=%s\n' "$(printf '%s' "${key}" | tr '[:lower:]' '[:upper:]')" "${value}" \
              >>"${GITHUB_ENV}"
          done <"${CI_TMP_ROOT}/resolve.env"

          bash scripts/ci/fetch.sh 2>&1 | tee -a "${log}"

          CI_OUTPUT_ENV="${CI_TMP_ROOT}/kmods.env" \
            bash scripts/ci/kmods.sh 2>&1 | tee -a "${log}"
          ci_load_env_file "${CI_TMP_ROOT}/kmods.env"

          CI_OUTPUT_ENV="${CI_TMP_ROOT}/esp.env" \
            bash scripts/ci/esp-prepare.sh 2>&1 | tee -a "${log}"
          ci_load_env_file "${CI_TMP_ROOT}/esp.env"

          bash scripts/ci/platform-runtime.sh 2>&1 | tee -a "${log}"

          # Same kernel, initramfs and extra files the stage workflows hand to initramfs.sh.
          CI_KERNEL_VERSION="${CI_KERNEL_VERSION:?kmods did not report a kernel version}" \
            CI_INITRAMFS_OUT="${CI_DEBUG_INITRAMFS}" \
            CI_INIT_SCRIPT="${GITHUB_WORKSPACE}/initramfs/boot/init" \
            CI_EXTRA_FILES="${GITHUB_WORKSPACE}/initramfs/lib/wf.sh:/lib/wf.sh ${GITHUB_WORKSPACE}/initramfs/boot/post.sh:/s3-post.sh" \
            CI_OUTPUT_ENV="${CI_TMP_ROOT}/initramfs.env" \
            bash scripts/ci/initramfs.sh 2>&1 | tee -a "${log}"

          CI_ESP_DIR="${CI_ESP_DIR:?esp-prepare did not report a directory}" \
            CI_INITRAMFS="${CI_DEBUG_INITRAMFS}" \
            CI_DISK_OUT="${CI_DEBUG_IMAGE}" \
            CI_PLATFORM_RUNTIME_DIR="${CI_TMP_ROOT}/runtime" \
            CI_OUTPUT_ENV="${CI_TMP_ROOT}/disk.env" \
            bash scripts/ci/disk.sh 2>&1 | tee -a "${log}"
          ci_load_env_file "${CI_TMP_ROOT}/disk.env"

          # The same preflight the stage workflows gate on.
          bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE_PATH:?disk.sh did not report an image}" 2>&1 \
            | tee -a "${log}"

          {
            printf 'image=%s\n' "${CI_IMAGE_PATH}"
            printf 'initramfs=%s\n' "${CI_DEBUG_INITRAMFS}"
            printf 'kernel=%s\n' "${CI_DEBUG_KERNEL}"
          } >>"${GITHUB_OUTPUT}"

          {
            printf 'image: `%s`\n' "${CI_IMAGE_PATH}"
            printf 'initramfs: `%s`\n' "${CI_DEBUG_INITRAMFS}"
            printf 'kernel: `%s`\n' "${CI_DEBUG_KERNEL}"
            printf 'logs: `%s`\n' "${CI_LOG_DIR}"
          } >>"${GITHUB_STEP_SUMMARY}"

      # s4 adds the network fixture; s5 also the upgrade payload it installs on boot 2.
      - name: Prepare the stage fixtures and payload
        if: ${{ inputs.stage == 's4' || inputs.stage == 's5' }}
        continue-on-error: true
        env:
          STAGE_INPUT: ${{ inputs.stage }}
          CI_IMAGE: ${{ steps.prepare.outputs.image }}
          CI_INITRAMFS: ${{ steps.prepare.outputs.initramfs }}
          CI_PLATFORM_RUNTIME_DIR: ${{ runner.temp }}/ci/runtime
        run: |
          set -euo pipefail
          log="${CI_LOG_DIR}/debug-fixtures.log"
          # shellcheck source=scripts/ci/lib.sh
          . scripts/ci/lib.sh
          if [ "${STAGE_INPUT}" = "s5" ]; then
            CI_OUTPUT_ENV="${CI_TMP_ROOT}/payload.env" \
              bash scripts/ci/payload-build.sh 2>&1 | tee -a "${log}"
            ci_load_env_file "${CI_TMP_ROOT}/payload.env"
            bash scripts/ci/ab-fixtures.sh \
              --network \
              --user-banner "user banner, edited before the upgrade" \
              --orphan-layer @overlay-25.12.1 \
              --payload "${CI_PAYLOAD_PATH:?payload-build did not report a payload}" 2>&1 \
              | tee -a "${log}"
          else
            bash scripts/ci/ab-fixtures.sh --network 2>&1 | tee -a "${log}"
          fi

      # The first gating boot, so the session opens next to the state under investigation.
      - name: Run the first boot of the chosen stage
        if: ${{ inputs.stage == 's4' || inputs.stage == 's5' }}
        continue-on-error: true
        env:
          STAGE_INPUT: ${{ inputs.stage }}
          BOOT_TIMEOUT: ${{ inputs.boot_timeout }}
          CI_KERNEL: ${{ steps.prepare.outputs.kernel }}
          CI_INITRAMFS: ${{ steps.prepare.outputs.initramfs }}
          CI_QEMU_DISK: ${{ steps.prepare.outputs.image }}
          CI_QEMU_MODE: uefi-disk
          CI_JUDGE_PREFIX: ""
        run: |
          set -euo pipefail
          boot_timeout="${BOOT_TIMEOUT:-1200}"
          case "${boot_timeout}" in
            '' | *[!0-9]*) echo "boot_timeout is not a number, using 1200"; boot_timeout=1200 ;;
          esac
          if [ "${boot_timeout}" -le 0 ]; then boot_timeout=1200; fi
          stop='^(ab-commit: committed slot=|ab-commit: stage=healthcheck-done .*result=fail|ab-commit: stage=commit .*result=fail|ab-boot: stage=boot result=fail)'
          if [ "${STAGE_INPUT}" = "s5" ]; then
            stop='^(S5-UPGRADE-DONE|ab-boot: stage=boot result=fail|ab-commit: stage=healthcheck-done .*result=fail)'
          fi
          CI_QEMU_STOP_PATTERN="${stop}" \
            CI_QEMU_CASE="${STAGE_INPUT}-boot1" \
            CI_QEMU_TIMEOUT="${boot_timeout}" \
            bash scripts/ci/qemu-smoke.sh 2>&1 | tee -a "${CI_LOG_DIR}/debug-boot1.log"

      # Separate from the boot and on always(): a failing qemu-smoke.sh would abort before any echo.
      - name: Print the boot decision
        if: ${{ always() && inputs.stage != 'none' }}
        run: |
          for serial in "${CI_TMP_ROOT:?}"/qemu/serial-*.log; do
            [ -f "${serial}" ] || continue
            printf '\n== %s ==\n' "${serial}"
            grep -E '^(probe=|ab-commit:|ab-boot:|S5-UPGRADE-DONE|ab-upgrade)' "${serial}" || true
          done

      # `always()`, not `!cancelled()`: a cancelled run still has the log that says why.
      - name: Upload the boot evidence
        if: ${{ always() && inputs.stage != 'none' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-${{ inputs.stage }}-logs
          # qemu-smoke.sh copies each console into the logs directory; no second copy.
          path: ${{ runner.temp }}/ci/logs
          if-no-files-found: warn
          retention-days: 7

      # Advisory only: a session that never came up looks like an unreachable relay here.
      - name: Report whether the relay answers
        if: ${{ always() }}
        run: |
          reached=""
          for host in uptermd.upterm.dev; do
            if timeout 5 bash -c "exec 3<>/dev/tcp/${host}/22" 2>/dev/null; then
              echo "relay reachable: ${host}:22"
              reached="${reached} ${host}"
            else
              echo "relay NOT reachable: ${host}:22"
            fi
          done
          printf 'relay: %s\n' "${reached:-none answered on port 22 (advisory)}" \
            >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

      # Not tmate: its public relays were shut down in July 2025. upterm authorises the guest
      # through the dispatcher's GitHub SSH keys, so `full-access` is only granted because
      # `limit-access-to-actor` is on, and the commit sha is pinned because v2.8.1 can move.
      - name: Open the interactive SSH session
        id: session
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        uses: owenthereal/action-upterm@6c2d60e09009f59cb4c45c88767c78701f14d121 # v2.8.1
        with:
          limit-access-to-actor: true
          full-access: true
          detached: true
          # Bounded so an unattended session cannot sit on the job cap.
          wait-timeout-minutes: 5

      - name: Publish the connection details
        if: ${{ always() }}
        run: |
          ssh_cmd='${{ steps.session.outputs.ssh-command }}'
          {
            echo "## Interactive session"
            echo
            if [ -n "${ssh_cmd}" ]; then
              echo 'Connect with your own key (limit-access-to-actor):'
              echo '```'
              echo "${ssh_cmd}"
              echo '```'
              echo
              echo 'Web shell also printed in the session step log; it is a bearer link, so it'
              echo 'is deliberately not repeated here.'
            else
              echo "No session: the upterm step did not publish a connection string."
              echo "Session step outcome: ${{ steps.session.outcome }}"
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ -n "${ssh_cmd}" ]; then
            printf 'CI_DEBUG_SSH_READY=1\n' >>"${GITHUB_ENV}"
            # Not a bearer credential: limit-access-to-actor allows only the dispatcher's keys.
            mkdir -p "${CI_TMP_ROOT:?}"
            printf '%s\n' "${ssh_cmd}" >"${CI_TMP_ROOT}/session-ssh.txt"
          else
            printf 'CI_DEBUG_SSH_READY=0\n' >>"${GITHUB_ENV}"
            # A relay client without a session would keep the keep-alive below holding on.
            if pgrep -x upterm >/dev/null 2>&1; then
              echo "killing the upterm process left behind by a session that never came up"
              pkill -x upterm || true
            fi
          fi

      - name: Publish the connection string as a file
        if: ${{ always() && env.CI_DEBUG_SSH_READY == '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-session
          path: ${{ runner.temp }}/ci/session-ssh.txt
          if-no-files-found: error
          retention-days: 1

      # Held open for the human: a published session AND a live upterm process, inside the job cap.
      - name: Keep the runner alive
        if: ${{ !cancelled() && env.CI_DEBUG_SSH_READY == '1' }}
        timeout-minutes: 150
        run: |
          echo "session open; the runner is held until the session ends or 140 minutes pass"
          started=$(date +%s)
          while pgrep -x upterm >/dev/null 2>&1; do
            sleep 30
            if [ $(( $(date +%s) - started )) -ge 8400 ]; then
              echo "stopped: the 140-minute bound was reached with upterm still running"
              exit 0
            fi
          done
          echo "stopped: upterm exited, which is what closing the session does"
