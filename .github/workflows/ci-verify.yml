name: static checks

# Stage 4 - verify.
#
# Synchronous, artifact-free checks: shell syntax, actionlint (installed at a pinned
# release by ./.github/actions/actionlint), ShellCheck (installed on the runner) and
# `python3 scripts/check_design.py all`, which turns the thresholds and contracts
# written in docs/ into executable assertions. The stage runs every check before
# failing so one run reports all findings, and scripts/ci/verify.sh writes one verdict
# line per check to the run summary.

on:
  workflow_call:
    outputs:
      verify_status:
        description: "Aggregate result of the verify stage"
        value: ${{ jobs.verify.outputs.verify_status }}
      design_checks_status:
        description: "Result of scripts/check_design.py all"
        value: ${{ jobs.verify.outputs.design_checks_status }}
      design_checks_problems:
        description: "Number of reported design problems"
        value: ${{ jobs.verify.outputs.design_checks_problems }}
      shellcheck_status:
        description: "Result of ShellCheck: ok or fail, a missing linter fails the stage"
        value: ${{ jobs.verify.outputs.shellcheck_status }}

permissions:
  contents: read

# One run per lane: a second automatic run on the same ref cancels the one in flight,
# while a manual dispatch neither cancels nor is cancelled by anything.
jobs:
  verify:
    name: static checks
    runs-on: ubuntu-latest
    # Downloading the linter, installing ShellCheck and running the whole test suite:
    # the 10 minutes this job used to allow were not enough for that.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      verify_status: ${{ steps.verify.outputs.verify_status }}
      design_checks_status: ${{ steps.verify.outputs.design_checks_status }}
      design_checks_problems: ${{ steps.verify.outputs.design_checks_problems }}
      shellcheck_status: ${{ steps.verify.outputs.shellcheck_status }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The linter fails the job here first, before any of the stage output is produced.
      # It also leaves the pinned binary on PATH, so the stage script below lints with
      # the version CI installed rather than whatever the runner image ships.
      - name: Lint the workflows
        uses: ./.github/actions/actionlint

      # verify.sh treats a missing linter as a stage failure, so the runner has to provide
      # it explicitly instead of relying on the image. The install is not allowed to fail
      # softly: a silently absent ShellCheck is exactly what used to hide the check.
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run static checks
        id: verify
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/verify.sh 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/verify.log"

      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        env:
          CI_DIAG_DIR: ${{ runner.temp }}/ci/diagnostics
        run: |
          mkdir -p "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}"
          bash scripts/ci/diagnostics.sh verify 2>&1 | tee -a "${CI_LOG_DIR:-${RUNNER_TEMP}/ci/logs}/diagnostics.log"

      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-verify
          path: |
            ${{ runner.temp }}/ci/logs
            ${{ runner.temp }}/ci/diagnostics/summary.txt
          if-no-files-found: ignore
          retention-days: 7
