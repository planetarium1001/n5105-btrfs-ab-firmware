name: S5 upgrade

# Stage S5 - upgrade payload, reclamation and the degraded boot.
#
# Four boots of one image file through the ESP: the firmware runs GRUB, which picks the entry
# ab-slot.cfg names - the path a real machine takes.
#
#   1  fresh install, `ab-slot status` healthy, `p4=ok`
#   2  `ab-upgrade /payload.tar` installs a test payload into the inactive slot and marks it
#      pending; the conflict report is written first and never blocks
#   3  the pending slot boots through GRUB, the health check passes, the slot is committed
#      and the unreachable layer is reclaimed
#   4  the writable partition is destroyed: the boot must degrade to a tmpfs upper and
#      still reach userspace
#
# Boots 2-4 print their evidence to /dev/console (procd sends hook stdout to syslog, so a hook
# that wants to be seen must write the console). s5-phase.sh grades on the host.

on:
  workflow_call:
    inputs:
      upstream_version: {description: "Resolved upstream version", required: true, type: string}
      upstream_base_url: {description: "Release directory URL for the target", required: true, type: string}
      kmods_dir: {description: "Kernel module directory name on the mirror", required: true, type: string}
      kernel_package: {description: "Kernel package version from the upstream manifest", required: true, type: string}
      platform_version: {description: "Platform version from the repository VERSION file", required: true, type: string}
    outputs:
      judge_line: {description: "Frozen S5 judge line from the commit boot", value: "${{ jobs.s5.outputs.judge_line }}"}
      upgrade_line: {description: "Evidence line from the upgrade boot", value: "${{ jobs.s5.outputs.upgrade_line }}"}
      degraded_line: {description: "Evidence line from the degraded boot", value: "${{ jobs.s5.outputs.degraded_line }}"}
      toolchain_line: {description: "Evidence line: btrfs tool works inside the guest", value: "${{ jobs.s5.outputs.toolchain_line }}"}
      runtime_packages: {description: "Runtime packages merged into the platform layer", value: "${{ jobs.s5.outputs.runtime_packages }}"}
      conflicts: {description: "Conflicts reported by the upgrade", value: "${{ jobs.s5.outputs.conflicts }}"}
      reclaimed: {description: "Layers reclaimed during the upgrade boot", value: "${{ jobs.s5.outputs.reclaimed }}"}
      payload_version: {description: "Rootfs version the test payload carries", value: "${{ jobs.s5.outputs.payload_version }}"}

permissions:
  contents: read

jobs:
  s5:
    name: S5 upgrade - upgrade and reclaim
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      CI_UPSTREAM_BASE_URL: ${{ inputs.upstream_base_url }}
      CI_KMODS_DIR: ${{ inputs.kmods_dir }}
      CI_KERNEL_PACKAGE: ${{ inputs.kernel_package }}
      CI_PLATFORM_VERSION: ${{ inputs.platform_version }}
    outputs:
      judge_line: ${{ steps.phase3.outputs.judge_line }}
      upgrade_line: ${{ steps.phase2.outputs.evidence_line }}
      toolchain_line: ${{ steps.phase1b.outputs.evidence_line }}
      degraded_line: ${{ steps.phase4.outputs.evidence_line }}
      conflicts: ${{ steps.phase3.outputs.conflicts }}
      reclaimed: ${{ steps.phase3.outputs.reclaimed }}
      payload_version: ${{ steps.payload.outputs.payload_version }}
      runtime_packages: ${{ steps.runtime.outputs.runtime_packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci
        with:
          download-upstream: "true"
          apt: btrfs-progs dosfstools gdisk util-linux cpio kmod qemu-system-x86 ovmf grub-common

      - name: Unpack the btrfs and vfat module closure
        id: kmods
        uses: ./.github/actions/run-stage-script
        with: {script: kmods.sh}

      - name: Prepare the ESP from the upstream bootloader
        id: esp
        uses: ./.github/actions/run-stage-script
        with: {script: esp-prepare.sh, log: esp.log}

      # btrfs-progs is not in the upstream rootfs; the platform layer carries it.
      - name: Resolve the btrfs runtime closure
        id: runtime
        uses: ./.github/actions/run-stage-script
        with: {script: platform-runtime.sh, log: runtime.log}

      - name: Build the boot initramfs
        id: initramfs
        env:
          CI_KERNEL_VERSION: ${{ steps.kmods.outputs.kernel_version }}
          CI_INITRAMFS_OUT: ${{ runner.temp }}/ci/initramfs/boot.cpio.gz
          CI_INIT_SCRIPT: ${{ github.workspace }}/initramfs/boot/init
          CI_EXTRA_FILES: ${{ github.workspace }}/initramfs/lib/wf.sh:/lib/wf.sh ${{ github.workspace }}/initramfs/boot/post.sh:/s3-post.sh
        run: bash scripts/ci/initramfs.sh 2>&1 | tee -a "${CI_LOG_DIR}/initramfs.log"

      - name: Assemble the disk image
        id: disk
        env:
          CI_INITRAMFS: ${{ steps.initramfs.outputs.initramfs_path }}
          CI_ESP_DIR: ${{ steps.esp.outputs.esp_dir }}
          CI_PLATFORM_RUNTIME_DIR: ${{ runner.temp }}/ci/runtime
        run: bash scripts/ci/disk.sh 2>&1 | tee -a "${CI_LOG_DIR}/disk.log"

      # The boots hand the machine to the firmware, so prove the ESP bootable first.
      - name: Preflight - the ESP boots through GRUB
        id: verify0
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE}" 2>&1 | tee -a "${CI_LOG_DIR}/grub-preflight.log"

      # The payload has to carry the same btrfs tooling the image ships, or the slot can never commit.
      - name: Build the test payload
        id: payload
        env:
          CI_INITRAMFS: ${{ steps.initramfs.outputs.initramfs_path }}
          CI_PLATFORM_RUNTIME_DIR: ${{ runner.temp }}/ci/runtime
        run: bash scripts/ci/payload-build.sh 2>&1 | tee -a "${CI_LOG_DIR}/payload.log"

      - name: Fixture - network, user banner, orphan layer and payload
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
          CI_PAYLOAD: ${{ steps.payload.outputs.payload_path }}
        run: |
          bash scripts/ci/ab-fixtures.sh \
            --network \
            --user-banner "user banner, edited before the upgrade" \
            --orphan-layer @overlay-25.12.1 \
            --payload "${CI_PAYLOAD}" 2>&1 \
            | tee -a "${CI_LOG_DIR}/fixture-1.log"

      - name: Boot 1 - fresh install is healthy
        id: boot1
        uses: ./.github/actions/qemu-boot
        with:
          case: s5-boot1
          mode: uefi-disk
          initramfs: ${{ steps.initramfs.outputs.initramfs_path }}
          image: ${{ steps.disk.outputs.image_path }}
          judge-prefix: ""
          stop-pattern: '^(ab-commit: committed slot=|ab-commit: stage=healthcheck-done .*result=fail|ab-commit: stage=commit .*result=fail|ab-boot: stage=boot result=fail)'

      - name: Phase 1b - verify the btrfs tool inside the guest
        id: phase1b
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          bash scripts/ci/s5-phase.sh --phase toolchain \
            --serial "${{ steps.boot1.outputs.serial_log }}" 2>&1 \
            | tee -a "${CI_LOG_DIR}/phase1b.log"

      - name: Fixture - run ab-upgrade on the next boot
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/ab-fixtures.sh --auto-upgrade 2>&1 | tee -a "${CI_LOG_DIR}/fixture-2.log"

      - name: Boot 2 - install the payload into the inactive slot
        id: boot2
        uses: ./.github/actions/qemu-boot
        with:
          case: s5-boot2
          mode: uefi-disk
          initramfs: ${{ steps.initramfs.outputs.initramfs_path }}
          image: ${{ steps.disk.outputs.image_path }}
          judge-prefix: ""
          stop-pattern: '^(S5-UPGRADE-DONE|ab-boot: stage=boot result=fail|ab-commit: stage=healthcheck-done .*result=fail)'
          timeout: "1200"

      - name: Phase 2 - verify the upgrade recorded the new layer
        id: phase2
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          bash scripts/ci/s5-phase.sh --phase upgrade --slot b \
            --version "${{ steps.payload.outputs.payload_version }}" \
            --layer "${{ steps.payload.outputs.payload_layer }}" 2>&1 \
            | tee -a "${CI_LOG_DIR}/phase2.log"

      # The upgrade marked slot b pending, so the file GRUB sources must name b - no injected ab.slot=.
      - name: Verify the upgrade pointed the next boot at slot b
        id: verify_upgrade
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE}" 2>&1 | tee -a "${CI_LOG_DIR}/grub-after-upgrade.log"

      - name: Boot 3 - commit the upgraded slot and reclaim
        id: boot3
        uses: ./.github/actions/qemu-boot
        with:
          case: s5-boot3
          mode: uefi-disk
          initramfs: ${{ steps.initramfs.outputs.initramfs_path }}
          image: ${{ steps.disk.outputs.image_path }}
          judge-prefix: ""
          stop-pattern: '^(ab-commit: committed slot=|ab-commit: stage=healthcheck-done .*result=fail|ab-commit: stage=commit .*result=fail|ab-boot: stage=boot result=fail)'

      - name: Phase 3 - verify the commit and the reclamation
        id: phase3
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/s5-phase.sh --phase commit --slot b 2>&1 | tee -a "${CI_LOG_DIR}/phase3.log"

      - name: Verify the commit left the next boot on slot b
        id: verify_commit
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/grub-render.sh --verify-esp "${CI_IMAGE}" 2>&1 | tee -a "${CI_LOG_DIR}/grub-after-commit.log"

      - name: Fixture - destroy the writable partition
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: bash scripts/ci/ab-fixtures.sh --break-p4 2>&1 | tee -a "${CI_LOG_DIR}/fixture-3.log"

      - name: Boot 4 - a broken writable partition degrades
        id: boot4
        uses: ./.github/actions/qemu-boot
        with:
          case: s5-boot4
          mode: uefi-disk
          initramfs: ${{ steps.initramfs.outputs.initramfs_path }}
          image: ${{ steps.disk.outputs.image_path }}
          judge-prefix: ""
          stop-pattern: '^(ab-boot: running slot|ab-boot: stage=boot result=fail)'

      - name: Phase 4 - verify the degraded boot reached userspace
        id: phase4
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
        run: |
          bash scripts/ci/s5-phase.sh --phase degraded \
            --serial "${{ steps.boot4.outputs.serial_log }}" 2>&1 \
            | tee -a "${CI_LOG_DIR}/phase4.log"

      - name: Collect the stage evidence
        if: always()
        uses: ./.github/actions/stage-evidence
        with:
          stage: s5
          name: evidence-s5
          diag-args: ${{ runner.temp }}/ci/qemu
          paths: |
            ${{ runner.temp }}/ci/logs
            ${{ runner.temp }}/ci/payload/payload.tar
            ${{ runner.temp }}/ci/runtime
            ${{ runner.temp }}/ci/s5-phase/esp

      # The five-column block, rendered by bash scripts/ci/stage-summary.sh --stage s5.
      - name: Write stage summary
        if: always()
        uses: ./.github/actions/stage-summary
        with:
          stage: s5
          result: ${{ job.status }}
          artifact: evidence-s5
          artifact-file: ${{ runner.temp }}/ci/payload/payload.tar
