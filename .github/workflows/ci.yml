name: Firmware CI - build and validate

# Single entry point: this file only orchestrates. Every stage is a reusable workflow next
# to this one, all real logic lives in scripts/ci/, and there is no workflow_run chaining, so
# a run has one graph and one verdict.
#
#   resolve ──┬── fetch ──┬── assemble ──┐
#             │           ├── s1..s5 ────┤
#             └── verify ────────────────┴── report
#
# workflow_dispatch resumes a failed run where it stopped and lets the slow QEMU probe run on
# its own.

on:
  # release.yml calls this workflow on a tag: a release is built by the stages a push runs.
  #
  # upstream_version is an input of the reusable call for the same reason it is an input of
  # the manual dispatch: the upstream auto-release line (upstream-watch.yml) builds a release
  # the pin does not name yet, and it must build it with the same stages, in the same run,
  # rather than with a second copy of this graph.
  workflow_call:
    inputs:
      upstream_version:
        description: "Upstream ImmortalWrt version, 'latest', or empty for the pinned default"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline stage to run"
        type: choice
        options:
          - all
          - fetch
          - assemble
          - s1
          - s2
          - s3
          - s4
          - s5
          - verify
        default: all
      upstream_version:
        description: "Upstream ImmortalWrt version, 'latest', or empty for the pinned default"
        type: string
        default: ""

permissions:
  contents: read

# Manual and automatic runs never cancel each other: a dispatch used to be killed by the next
# push to the same ref, and a push by a dispatch. The composite refactor of this file also
# removed the per-job `permissions:` repeats - the top-level block covers them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # The platform version has one source: VERSION. This is also the only job ci.yml runs
  # itself - every other job is a reusable-workflow call, which accepts no steps and no
  # timeout - so it carries the entry point's own budget.
  versions:
    name: read the platform version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platform_version: ${{ steps.read.outputs.platform_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci

      - name: Read VERSION
        id: read
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [ -n "${version}" ] || { echo "::error::VERSION is empty"; exit 1; }
          printf 'platform_version=%s\n' "${version}"
          printf 'platform_version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"

  # Stage 1: resolve the upstream release, the platform version and the cache key.
  resolve:
    name: resolve upstream
    uses: ./.github/workflows/ci-resolve.yml
    with:
      upstream_version: ${{ inputs.upstream_version || '' }}

  # Stage 2: the upstream artifacts every stage except verify needs, so resuming one resumes this.
  fetch:
    name: fetch upstream
    needs: resolve
    if: ${{ needs.resolve.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.stage != 'verify') }}
    uses: ./.github/workflows/ci-fetch.yml
    with:
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      upstream_base_url: ${{ needs.resolve.outputs.upstream_base_url }}
      kmods_dir: ${{ needs.resolve.outputs.kmods_dir }}
      kernel_package: ${{ needs.resolve.outputs.kernel_package }}
      rootfs_name: ${{ needs.resolve.outputs.rootfs_name }}
      kernel_name: ${{ needs.resolve.outputs.kernel_name }}
      btrfs_kmod_name: ${{ needs.resolve.outputs.btrfs_kmod_name }}
      rootfs_sha256: ${{ needs.resolve.outputs.rootfs_sha256 }}
      kernel_sha256: ${{ needs.resolve.outputs.kernel_sha256 }}
      btrfs_kmod_sha256: ${{ needs.resolve.outputs.btrfs_kmod_sha256 }}
      cache_key: ${{ needs.resolve.outputs.cache_key }}
      cache_restore_prefix: ${{ needs.resolve.outputs.cache_restore_prefix }}

  # Stage 3: assemble the update payload (S0 skeleton).
  assemble:
    name: assemble payload
    needs: [resolve, fetch, versions]
    if: ${{ needs.fetch.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.stage == 'all' || inputs.stage == 'assemble') }}
    uses: ./.github/workflows/ci-assemble.yml
    with:
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      upstream_base_url: ${{ needs.resolve.outputs.upstream_base_url }}
      kmods_dir: ${{ needs.resolve.outputs.kmods_dir }}
      kernel_package: ${{ needs.resolve.outputs.kernel_package }}
      platform_version: ${{ needs.versions.outputs.platform_version }}

  # Stage 4: upstream-consumption spike - official kernel, official btrfs modules.
  s1:
    name: S1 probe - kernel mounts btrfs
    needs: [resolve, fetch]
    if: ${{ needs.fetch.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.stage == 'all' || inputs.stage == 's1') }}
    uses: ./.github/workflows/ci-s1.yml
    with:
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      upstream_base_url: ${{ needs.resolve.outputs.upstream_base_url }}
      kmods_dir: ${{ needs.resolve.outputs.kmods_dir }}
      kernel_package: ${{ needs.resolve.outputs.kernel_package }}

  # Stage 5: four-partition disk image assembly (the heaviest stage, 40 min budget).
  s2:
    name: S2 image - four partitions
    needs: [resolve, fetch, versions]
    if: ${{ needs.fetch.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.stage == 'all' || inputs.stage == 's2') }}
    uses: ./.github/workflows/ci-s2.yml
    with:
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      upstream_base_url: ${{ needs.resolve.outputs.upstream_base_url }}
      kmods_dir: ${{ needs.resolve.outputs.kmods_dir }}
      kernel_package: ${{ needs.resolve.outputs.kernel_package }}
      platform_version: ${{ needs.versions.outputs.platform_version }}

  # Stage 6: layered boot - the image booted twice proves the writable generation survives.
  s3:
    name: S3 boot - layered root
    needs: [resolve, fetch, versions]
    if: ${{ needs.fetch.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.stage == 'all' || inputs.stage == 's3') }}
    uses: ./.github/workflows/ci-s3.yml
    with:
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      upstream_base_url: ${{ needs.resolve.outputs.upstream_base_url }}
      kmods_dir: ${{ needs.resolve.outputs.kmods_dir }}
      kernel_package: ${{ needs.resolve.outputs.kernel_package }}
      platform_version: ${{ needs.versions.outputs.platform_version }}

  # Stage 7: A/B state machine - commit, abandon and rollback through the ESP state.
  s4:
    name: S4 slots - A/B state machine
    needs: [resolve, fetch, versions]
    if: ${{ needs.fetch.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.stage == 'all' || inputs.stage == 's4') }}
    uses: ./.github/workflows/ci-s4.yml
    with:
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      upstream_base_url: ${{ needs.resolve.outputs.upstream_base_url }}
      kmods_dir: ${{ needs.resolve.outputs.kmods_dir }}
      kernel_package: ${{ needs.resolve.outputs.kernel_package }}
      platform_version: ${{ needs.versions.outputs.platform_version }}

  # Stage 8: upgrade payload, reclamation and the degraded boot.
  s5:
    name: S5 upgrade - upgrade and reclaim
    needs: [resolve, fetch, versions]
    if: ${{ needs.fetch.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.stage == 'all' || inputs.stage == 's5') }}
    uses: ./.github/workflows/ci-s5.yml
    with:
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      upstream_base_url: ${{ needs.resolve.outputs.upstream_base_url }}
      kmods_dir: ${{ needs.resolve.outputs.kmods_dir }}
      kernel_package: ${{ needs.resolve.outputs.kernel_package }}
      platform_version: ${{ needs.versions.outputs.platform_version }}

  # Stage 9: static checks that need no upstream artifact.
  verify:
    name: static checks
    needs: resolve
    if: ${{ needs.resolve.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.stage == 'all' || inputs.stage == 'verify') }}
    uses: ./.github/workflows/ci-verify.yml

  # Stage 10: single verdict, rendered as the run summary.
  report:
    name: report
    needs: [resolve, fetch, assemble, s1, s2, s3, s4, s5, verify]
    if: ${{ always() }}
    uses: ./.github/workflows/ci-report.yml
    permissions:
      contents: read
      # The report reads job start/end times from the Actions API for its duration column.
      actions: read
    with:
      stage: ${{ inputs.stage || 'all' }}
      trigger: ${{ github.event_name }}
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}
      resolve_result: ${{ needs.resolve.result }}
      fetch_result: ${{ needs.fetch.result }}
      assemble_result: ${{ needs.assemble.result }}
      s1_result: ${{ needs.s1.result }}
      s2_result: ${{ needs.s2.result }}
      s3_result: ${{ needs.s3.result }}
      s4_result: ${{ needs.s4.result }}
      s5_result: ${{ needs.s5.result }}
      verify_result: ${{ needs.verify.result }}
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      version_source: ${{ needs.resolve.outputs.version_source }}
      kernel_package: ${{ needs.resolve.outputs.kernel_package }}
      kmods_dir: ${{ needs.resolve.outputs.kmods_dir }}
      cache_key: ${{ needs.resolve.outputs.cache_key }}
      cache_hit: ${{ needs.fetch.outputs.cache_hit }}
      fetch_total_bytes: ${{ needs.fetch.outputs.fetch_total_bytes }}
      payload_members: ${{ needs.assemble.outputs.payload_members }}
      payload_total_bytes: ${{ needs.assemble.outputs.payload_total_bytes }}
      payload_manifest_sha256: ${{ needs.assemble.outputs.payload_manifest_sha256 }}
      s1_line: ${{ needs.s1.outputs.judge_line }}
      s1_modules: ${{ needs.s1.outputs.module_count }}
      s1_boot_seconds: ${{ needs.s1.outputs.boot_seconds }}
      s1_uefi_line: ${{ needs.s1.outputs.uefi_line }}
      s1_apk_crosscheck: ${{ needs.s1.outputs.apk_crosscheck }}
      s2_line: ${{ needs.s2.outputs.judge_line }}
      s2_image_bytes: ${{ needs.s2.outputs.image_bytes }}
      s2_image_gz_bytes: ${{ needs.s2.outputs.image_gz_bytes }}
      s2_rootfs_files: ${{ needs.s2.outputs.rootfs_files }}
      s2_host_checks: ${{ needs.s2.outputs.host_checks }}
      s3_line: ${{ needs.s3.outputs.judge_line }}
      s3_line_boot2: ${{ needs.s3.outputs.judge_line_boot2 }}
      s3_slot: ${{ needs.s3.outputs.slot }}
      s3_upper: ${{ needs.s3.outputs.upper }}
      s4_line_commit_a: ${{ needs.s4.outputs.line_commit_a }}
      s4_line_abandon_b: ${{ needs.s4.outputs.line_abandon_b }}
      s4_line_commit_b: ${{ needs.s4.outputs.line_commit_b }}
      s4_committed_final: ${{ needs.s4.outputs.committed_final }}
      s4_line_rollback: ${{ needs.s4.outputs.line_rollback }}
      s4_next_slot_final: ${{ needs.s4.outputs.next_slot_final }}
      s5_line: ${{ needs.s5.outputs.judge_line }}
      s5_upgrade_line: ${{ needs.s5.outputs.upgrade_line }}
      s5_degraded_line: ${{ needs.s5.outputs.degraded_line }}
      s5_conflicts: ${{ needs.s5.outputs.conflicts }}
      s5_reclaimed: ${{ needs.s5.outputs.reclaimed }}
      design_checks_status: ${{ needs.verify.outputs.design_checks_status }}
      design_checks_problems: ${{ needs.verify.outputs.design_checks_problems }}
      shellcheck_status: ${{ needs.verify.outputs.shellcheck_status }}
