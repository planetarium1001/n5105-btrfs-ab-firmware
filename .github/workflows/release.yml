name: Firmware CI - Release

# Publishing is a tag action, never a branch action: pushing to main validates, a tag
# releases. The build is the ordinary pipeline (ci.yml), so a release is by definition
# something the same stages already proved.
#
# Two upgrade gates sit on top of that proof: a release that cannot install over the
# previous formal release is not published, and neither is one that moved the upstream base
# or the kernel while claiming the same-base upgrade. Both live in ci-upgrade-gates.yml -
# the cross gate reuses ci-upgrade-cross.yml unchanged, the same-base gate installs this
# run's payload over the previous release's own published image. v0.0.9 went out while cross
# was red (run 43622253559) because publish only waited for build; `publish` now waits for
# the build and both gates, and a skipped gate is not a passed one.
#
#   git tag -a v0.0.8 -m "0.0.8: ..." && git push origin v0.0.8
#
# The publishing steps are not here: they live in release-publish.yml, which the upstream
# auto-release line (upstream-watch.yml) calls too. Two callers, one implementation - what
# "publish" means cannot drift between the two lines, and the release preflight runs on
# both of them.
#
# The tagged line publishes VERSION: the tag has to agree with it, which this caller lets
# release-publish.yml assert rather than trusting the caller.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Verify Pipeline - S1 to S5
    uses: ./.github/workflows/ci.yml
    # A caller's permissions are a ceiling, not a scope: every job of the called workflow has
    # to fit inside it, and a job that asks for more makes GitHub reject the whole run at
    # startup - no job list, no log, only "This run likely failed because of a workflow file
    # issue" (run 45726019172, the same mistake with contents instead of actions).
    #
    # Both keys below are what ci.yml's jobs ask for: `actions: read` for the report job's
    # duration column, `contents: write` for the audit job's automation-log commit. The audit
    # job runs only on a push to main, so a tag run calls it and skips it - the request still
    # has to fit inside this ceiling, and the jobs that do run here keep the read-only token
    # they get from ci.yml's own top-level block.
    permissions:
      contents: write
      actions: read

  # The cross gate keeps the call it has always had. It is the tag line's original proof and
  # moving it behind the wrapper would make a rename in the wrapper able to unhook it; the
  # wrapper's cross mode exists for the other caller (the automatic line), where the gate has
  # to be reachable under the same contract as the same-base one.
  cross:
    name: Cross-Version Upgrade
    needs: [build]
    permissions:
      contents: read
    uses: ./.github/workflows/ci-upgrade-cross.yml

  same-base:
    name: Same-Base Upgrade
    needs: [build]
    permissions:
      contents: read
    # The second gate: the previous release shares this one's upstream base and kernel, and
    # this release installs over it. Without it a release could move the base while the
    # cross gate stayed green - a real upgrade, but not the same-base upgrade the update
    # prompt's "patch ranges are covered" sentence claims.
    uses: ./.github/workflows/ci-upgrade-gates.yml
    with:
      mode: same-base

  publish:
    name: Publish
    # Input is never a release. Two gates, not one: cross proves an upgrade across whatever
    # the two releases pinned, same-base proves the patch-range claim, and a red gate - or a
    # skipped one, which is not a passed proof - publishes nothing. `needs` has to name every
    # job a release depends on; a publish that only needed build is how v0.0.9 shipped while
    # cross was red (run 43622253559), and the same mistake with one of these added is how a
    # base move would ship while its own gate said nothing.
    needs: [build, cross, same-base]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ github.ref_name }}
      tag-policy: v
