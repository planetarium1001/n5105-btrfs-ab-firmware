name: Firmware CI - release

# Publishing is a tag action, never a branch action: pushing to main validates, a tag
# releases. The build is the ordinary pipeline (ci.yml), so a release is by definition
# something the same stages already proved.
#
#   git tag -a v0.0.8 -m "0.0.8: ..." && git push origin v0.0.8
#
# The publishing steps are not here: they live in release-publish.yml, which the upstream
# auto-release line (upstream-watch.yml) calls too. Two callers, one implementation - what
# "publish" means cannot drift between the two lines, and the release preflight runs on
# both of them.
#
# The tagged line publishes VERSION: the tag has to agree with it, which this caller lets
# release-publish.yml assert rather than trusting the caller.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: verify pipeline - S1 to S5
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # ci.yml's report job reads the Actions API for its duration column, and a called
      # workflow may not ask for a permission its caller does not grant: without this the
      # run fails at startup and no job ever appears.
      actions: read

  cross:
    name: cross-version upgrade
    needs: [build]
    permissions:
      contents: read
    uses: ./.github/workflows/ci-upgrade-cross.yml

  publish:
    name: publish
    needs: build
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ github.ref_name }}
      tag-policy: v
