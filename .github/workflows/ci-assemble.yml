name: assemble payload

# Stage 3 - assemble (S0 skeleton).
#
# Publishes a payload directory that follows docs/conflicts-payload.md: member names,
# per-member size and sha256, format tag and rootfs version. A member the build cannot
# produce fails the build instead of being listed as missing.

on:
  workflow_call:
    inputs:
      upstream_version: {description: "Resolved upstream version, recorded in the payload manifest", required: true, type: string}
      upstream_base_url: {description: "Release directory URL for the target", required: false, type: string, default: ""}
      kernel_package: {description: "Kernel package version, recorded in the payload manifest", required: true, type: string}
      kmods_dir: {description: "Kernel module directory name on the mirror", required: false, type: string, default: ""}
      platform_version: {description: "Platform version from the repository VERSION file", required: true, type: string}
    outputs:
      payload_manifest_sha256: {description: "sha256 of the produced payload manifest", value: "${{ jobs.assemble.outputs.payload_manifest_sha256 }}"}
      payload_total_bytes: {description: "Total size of the payload members", value: "${{ jobs.assemble.outputs.payload_total_bytes }}"}
      payload_members: {description: "Comma separated list of payload members", value: "${{ jobs.assemble.outputs.payload_members }}"}
      artifact_name: {description: "Name of the artifact that carries the payload", value: "${{ jobs.assemble.outputs.artifact_name }}"}

permissions:
  contents: read

jobs:
  assemble:
    name: assemble payload
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      CI_KERNEL_PACKAGE: ${{ inputs.kernel_package }}
      CI_UPSTREAM_BASE_URL: ${{ inputs.upstream_base_url }}
      CI_KMODS_DIR: ${{ inputs.kmods_dir }}
      CI_PLATFORM_VERSION: ${{ inputs.platform_version }}
      # /s3-post.sh is injected only when this is 1: this stage publishes the image's initramfs.
      AB_CI_HOOKS: ${{ vars.AB_CI_HOOKS }}
    outputs:
      payload_manifest_sha256: ${{ steps.assemble.outputs.payload_manifest_sha256 }}
      payload_total_bytes: ${{ steps.assemble.outputs.payload_total_bytes }}
      payload_sha256: ${{ steps.assemble.outputs.payload_manifest_sha256 }}
      payload_members: ${{ steps.assemble.outputs.payload_members }}
      payload_path: ${{ steps.assemble.outputs.payload_path }}
      payload_check: ${{ steps.assemble.outputs.payload_check }}
      artifact_name: payload-upgrade
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Prepare the runner
        uses: ./.github/actions/setup-ci

      - name: Download upstream artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-files
          path: ${{ runner.temp }}/ci/fetch

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cpio kmod

      - name: Unpack the btrfs and vfat module closure
        id: kmods
        uses: ./.github/actions/run-stage-script
        with: {script: kmods.sh}

      - name: Resolve the btrfs runtime closure
        id: runtime
        uses: ./.github/actions/run-stage-script
        with: {script: platform-runtime.sh, log: runtime.log}

      # wf.sh always travels with the boot init; the S3 guest assertion only when AB_CI_HOOKS=1.
      - name: Build the boot initramfs
        id: initramfs
        env:
          CI_KERNEL_VERSION: ${{ steps.kmods.outputs.kernel_version }}
          CI_INITRAMFS_OUT: ${{ runner.temp }}/ci/initramfs/boot.cpio.gz
          CI_INIT_SCRIPT: ${{ github.workspace }}/initramfs/boot/init
        run: |
          extra="${GITHUB_WORKSPACE}/initramfs/lib/wf.sh:/lib/wf.sh"
          if [ "${AB_CI_HOOKS:-0}" = "1" ]; then
            extra="${extra} ${GITHUB_WORKSPACE}/initramfs/boot/post.sh:/s3-post.sh"
          fi
          CI_EXTRA_FILES="${extra}" bash scripts/ci/initramfs.sh 2>&1 \
            | tee -a "${CI_LOG_DIR}/initramfs.log"

      - name: Assemble payload
        id: assemble
        env:
          CI_INITRAMFS: ${{ steps.initramfs.outputs.initramfs_path }}
          CI_PLATFORM_RUNTIME_DIR: ${{ runner.temp }}/ci/runtime
        run: bash scripts/ci/assemble.sh 2>&1 | tee -a "${CI_LOG_DIR}/assemble.log"

      - name: Upload payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: payload-upgrade
          path: |
            ${{ runner.temp }}/ci/assemble/payload.tar
            ${{ runner.temp }}/ci/assemble/payload/manifest.json
            ${{ runner.temp }}/ci/assemble/payload-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        env:
          CI_DIAG_DIR: ${{ runner.temp }}/ci/diagnostics
        run: |
          bash scripts/ci/diagnostics.sh assemble "${CI_ASSEMBLE_DIR}" 2>&1 | tee -a "${CI_LOG_DIR}/diagnostics.log"

      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-assemble
          path: |
            ${{ runner.temp }}/ci/logs
            ${{ runner.temp }}/ci/diagnostics/summary.txt
          if-no-files-found: ignore
          retention-days: 7
