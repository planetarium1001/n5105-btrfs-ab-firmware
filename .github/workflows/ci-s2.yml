name: S2 image

# Stage S2 - four-partition disk image assembly.
#
# Builds the installable image from the verified upstream payload and asserts the geometry
# docs/partitions.md freezes: p1 ESP (vfat, GRUB), p2/p3 slot-a/slot-b (btrfs, @sys +
# @platform), p4 data (btrfs, @overlay-<version>, @docker, @swap, @data).
#
# Verification happens twice - on the host against the raw image and inside the guest, which
# reads the kernel, the btrfs module and the partition table back. Only the guest gates:
#
#     S2-RESULT=ok parts=4 images=<bytes>

on:
  workflow_call:
    inputs:
      upstream_version: {description: "Resolved upstream version", required: true, type: string}
      upstream_base_url: {description: "Release directory URL for the target", required: true, type: string}
      kmods_dir: {description: "Kernel module directory name on the mirror", required: true, type: string}
      kernel_package: {description: "Kernel package version from the upstream manifest", required: true, type: string}
      platform_version: {description: "Platform version from the repository VERSION file", required: true, type: string}
    outputs:
      judge_line: {description: "Frozen S2 judge line from the gating guest run", value: "${{ jobs.s2.outputs.judge_line }}"}
      image_bytes: {description: "Size of the assembled raw image", value: "${{ jobs.s2.outputs.image_bytes }}"}
      image_gz_bytes: {description: "Size of the compressed image artifact", value: "${{ jobs.s2.outputs.image_gz_bytes }}"}
      rootfs_files: {description: "Files in @sys, counted by the host verifier", value: "${{ jobs.s2.outputs.rootfs_files }}"}
      host_checks: {description: "Number of host-side assertions that passed", value: "${{ jobs.s2.outputs.host_checks }}"}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  s2:
    name: S2 image - four partitions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      CI_UPSTREAM_BASE_URL: ${{ inputs.upstream_base_url }}
      CI_KMODS_DIR: ${{ inputs.kmods_dir }}
      CI_KERNEL_PACKAGE: ${{ inputs.kernel_package }}
      CI_PLATFORM_VERSION: ${{ inputs.platform_version }}
    outputs:
      judge_line: ${{ steps.probe.outputs.judge_line }}
      image_bytes: ${{ steps.disk.outputs.image_bytes }}
      image_gz_bytes: ${{ steps.disk.outputs.image_gz_bytes }}
      rootfs_files: ${{ steps.verify.outputs.rootfs_files }}
      host_checks: ${{ steps.verify.outputs.verified_checks }}
    steps:
      - name: Check out the repository
        uses: ./.github/actions/setup-ci
        with:
          download-upstream: "true"
          apt: btrfs-progs dosfstools gdisk fdisk util-linux e2fsprogs cpio kmod qemu-system-x86 ovmf

      - name: Unpack the btrfs module closure
        id: kmods
        uses: ./.github/actions/run-stage-script
        with: {script: kmods.sh}

      # The ESP needs an initrd per slot; the production one arrives in S3.
      - name: Build the payload initramfs
        id: initramfs
        env:
          CI_KERNEL_VERSION: ${{ steps.kmods.outputs.kernel_version }}
        run: bash scripts/ci/initramfs.sh 2>&1 | tee -a "${CI_LOG_DIR}/initramfs.log"

      - name: Prepare the ESP from the upstream bootloader
        id: esp
        uses: ./.github/actions/run-stage-script
        with: {script: esp-prepare.sh, log: esp.log}

      # The platform layer carries btrfs-progs: the upstream rootfs has no btrfs tool.
      - name: Resolve the btrfs runtime closure
        id: runtime
        uses: ./.github/actions/run-stage-script
        with: {script: platform-runtime.sh, log: runtime.log}

      # The S1 probe stands in as initrd: it only answers /dev/vda, hence the image-probe artifact.
      - name: Assemble the disk image
        id: disk
        env:
          CI_PLATFORM_RUNTIME_DIR: ${{ runner.temp }}/ci/runtime
          CI_INITRAMFS: ${{ runner.temp }}/ci/initramfs/initramfs.cpio.gz
          CI_ESP_DIR: ${{ steps.esp.outputs.esp_dir }}
          CI_INITRAMFS_KIND: probe
          CI_ALLOW_PROBE_INIT: "1"
        run: bash scripts/ci/disk.sh 2>&1 | tee -a "${CI_LOG_DIR}/disk.log"

      - name: Verify the image on the host
        id: verify
        env:
          CI_IMAGE: ${{ steps.disk.outputs.image_path }}
          CI_DISK_DIR: ${{ runner.temp }}/ci/disk
          CI_EXPECT_OUT: ${{ runner.temp }}/ci/disk/s2-expect.txt
          # image-verify cross-checks ab/image.json against what the build installed.
          CI_INITRAMFS_KIND: probe
        run: bash scripts/ci/image-verify.sh 2>&1 | tee -a "${CI_LOG_DIR}/image-verify.log"

      # The assertion initramfs carries the guest script and the host-generated expectations,
      # so the guest recomputes them. Tools come from the locked upstream packages: resolving
      # them with `command -v` is what used to put glibc binaries in a musl image.
      - name: Build the assertion initramfs
        id: assert_initramfs
        env:
          CI_KERNEL_VERSION: ${{ steps.kmods.outputs.kernel_version }}
          CI_INITRAMFS_OUT: ${{ runner.temp }}/ci/initramfs/assert.cpio.gz
          CI_EXPECT_FILE: ${{ steps.verify.outputs.expect_file }}
          CI_GUEST_SCRIPT: ${{ github.workspace }}/tests/modules/image/guest-assert.sh
        run: |
          CI_INITRAMFS_TOOLSET=assert \
            CI_EXTRA_FILES="${CI_GUEST_SCRIPT}:/s2.sh ${CI_EXPECT_FILE}:/s2-expect.txt" \
            bash scripts/ci/initramfs.sh 2>&1 | tee -a "${CI_LOG_DIR}/assert-initramfs.log"

      - name: Boot the image and assert its geometry
        id: probe
        uses: ./.github/actions/qemu-boot
        with:
          case: s2
          initramfs: ${{ runner.temp }}/ci/initramfs/assert.cpio.gz
          image: ${{ steps.disk.outputs.image_path }}
          init: /s2.sh
          judge-prefix: S2-RESULT
          mem: "1536"
          log: qemu.log

      - name: Collect the stage evidence
        if: always()
        uses: ./.github/actions/stage-evidence
        with:
          stage: s2
          name: evidence-s2
          diag-args: ${{ runner.temp }}/ci/disk
          paths: |
            ${{ runner.temp }}/ci/logs
            ${{ runner.temp }}/ci/disk/sfdisk-verify.json
            ${{ runner.temp }}/ci/disk/sfdisk.log
            ${{ runner.temp }}/ci/disk/s2-expect.txt
            ${{ runner.temp }}/ci/disk/sys-diff.log
            ${{ runner.temp }}/ci/initramfs/assert.cpio.gz

      # Kept for a day: it is reproducible in minutes and costs ~80 MB per run.
      - name: Upload the disk image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-probe
          path: ${{ runner.temp }}/ci/disk/*.img.gz
          if-no-files-found: ignore
          retention-days: 1

      # The five-column block, rendered by bash scripts/ci/stage-summary.sh --stage s2.
      - name: Write stage summary
        if: always()
        uses: ./.github/actions/stage-summary
        with:
          stage: s2
          result: ${{ job.status }}
          artifact: image-probe
          artifact-file: ${{ runner.temp }}/ci/disk/n5105-ab-image.img.gz
