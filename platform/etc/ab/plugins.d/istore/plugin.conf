# iStore, as a recipe rather than a recommendation.
#
# It ships disabled: a third-party store is the operator's decision, and the versions it
# offers move with its own feed, not with this project. `ab-packages plugins list` shows it
# on every machine; `plugins check istore` is the one command that goes to the network, and
# it answers whether the feeds are reachable and whether any of them outranks a base package.
#
# Before enabling it, put the store's public key where apk looks for keys:
#   https://istore.istoreos.com/repo-apk/istore-apk.pem -> /etc/apk/keys/istore-apk.pem
# This project never imports a key; `key =` below only refuses a declaration whose key is
# missing, so that a store can never be enabled by a config that forgot one.
#
# The three feeds are one repository split by purpose: `store` carries the store itself,
# `compat` the Lua compatibility shims older menus need, `meta` the package metadata the
# store's own installer reads. Only one package is named; apk resolves the rest, preferring
# the base feeds for anything they already carry.
# This file is data, not shell: CI lints everything under platform/ with `sh`, so the
# assignment form below is also what keeps the linter quiet (SC2034 on a variable nobody
# reads). The parser trims blanks on both sides of `=`, so `key = value` works too - a
# declaration written by hand does not have to look like this one.
# shellcheck disable=SC2034
api=1
kind=packages
enabled=no
feed=https://istore.istoreos.com/repo-apk/all/store/packages.adb
feed=https://istore.istoreos.com/repo-apk/all/compat/packages.adb
feed=https://istore.istoreos.com/repo-apk/all/meta/packages.adb
key=/etc/apk/keys/istore-apk.pem
arch=noarch
package=luci-app-store
